services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: corteza
      POSTGRES_PASSWORD: corteza
      POSTGRES_DB: corteza
    volumes:
      - dbdata:/var/lib/postgresql/data

  server:
    image: cortezaproject/corteza:2026.9.0
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "18080:80"
    environment:
      DB_DSN: postgres://corteza:corteza@db:5432/corteza?sslmode=disable
      DOMAIN: localhost:18080
      HTTP_SERVER_ASSETS_PATH: /corteza/branding-assets
    volumes:
      - ./server/provision/750_crm:/corteza/provision/750_crm:ro
      - ./branding:/corteza/webapp/branding:ro
      - ./branding/server-assets:/corteza/branding-assets:ro
      - serverdata:/data

volumes:
  dbdata:
  serverdata:
