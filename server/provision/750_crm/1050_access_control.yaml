# CRM roles and permissions
#
# Authenticated users can already read namespaces, modules, pages, charts and
# records (000_base). CRM users can also create and edit CRM records and run
# the CRM workflows (buttons on the campaign and settings pages).
#
# Assign users to the role in Admin Area > Roles, or with:
#   corteza-server roles useradd crm-user <email>

#
# CRM users get access module by module, so the AI settings module (which
# holds the Anthropic API key) is left out. Signed-in users are denied it
# outright by branding/tools/update-existing-crm.sh (the importer cannot
# resolve the built-in authenticated role, so that rule is written with SQL;
# run the script after a fresh install too). Administrators keep access
# through their own role, which is
# checked first. Note that within the main roles a deny wins over an allow,
# so never deny the CRM user role itself: administrators usually hold it too.

roles:
  crm-user:
    name: CRM user
    meta:
      description: Sales and marketing users of the CRM namespace

allow:
  crm-user:
    corteza::compose:namespace/crm:
      - read
      - pages.search
      - modules.search
      - charts.search

    corteza::compose:module/crm/*:
      - read

    corteza::compose:module-field/crm/*/*:
      - record.value.read
      - record.value.update

    corteza::automation:workflow/*:
      - read
      - execute

    corteza::compose:module/crm/Company:
      - record.create
      - records.search
    corteza::compose:record/crm/Company/*:
      - read
      - update
      - delete
      - revisions.search

    corteza::compose:module/crm/Contact:
