# DM-CRM branding
#
# The files referenced here are served from /branding (the repo's branding/
# folder, mounted into the web app directory by docker-compose.yml).
#
# Only plain values can go here: the settings importer turns a list of
# objects into an empty list, so the colour themes (ui.studio.themes) and the
# column-resize code snippet (code-snippets) are set by
# branding/tools/apply-branding-settings.sh instead.
#
# The importer also overwrites existing settings even with --skip-existing,
# which is why branding/tools/update-existing-crm.sh leaves this file out.

settings:
  ui.main-logo: /branding/dm-crm-logo.svg
  ui.icon-logo: /branding/dm-crm-icon.svg

  # Login page background (auth.ui.background-image-src only accepts
  # uploaded attachments, so the image is set through the styles instead)
  auth.ui.styles: "{ background: url('/branding/dm-crm-login-bg.svg') center / cover no-repeat; }"
