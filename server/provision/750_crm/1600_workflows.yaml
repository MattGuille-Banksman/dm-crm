    steps:
      - id: 10
        kind: gateway
        ref: excl
        meta:
          name: Static with filter?
          visual: { id: "10", parent: "1", value: null, xywh: [200, 80, 0, 0] }
      - id: 15
        kind: error
        arguments:
          - { target: message, type: String, value: "Snapshots are for Static segments that have a filter. Active segments always show their live matches." }
