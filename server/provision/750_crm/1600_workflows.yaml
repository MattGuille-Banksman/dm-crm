# CRM automation flows
#
# These are native Corteza workflows (the node-based automation engine):
#   AutomationFlow -> workflow, AutomationNode -> step, AutomationEdge -> path,
#   AutomationRun  -> workflow session (+ a business-level row in the
#                     AutomationRun module, written by the flows below).
#
# Every step, trigger and path carries meta.visual so the flows open as
# flowcharts in the Workflow editor (Workflows app) where they can be edited.
#
# Conventions
# - Results of record functions are never written into the "record" variable,
#   because in before* triggers whatever "record" holds at the end is what
#   gets saved.
# - Number/ID interpolation uses format() (fmt.Sprintf); "+" on two strings
#   concatenates.

workflows:

  # ===========================================================================
  # Deal: derive probability, weighted amount and closed flags from the stage
  crm_deal_stage_rules:
    meta:
      name: "CRM: Deal stage rules"
      description: Sets probability, weighted amount, closed/won flags and close timestamp from the deal stage.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: beforeCreate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Deal] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 0, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
      - resourceType: compose:record
        eventType: beforeUpdate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Deal] }
        meta:
          visual:
            id: "t2"
            parent: "1"
            xywh: [0, 160, 0, 0]
            edges:
              - { parentID: "t2", childID: "10", meta: { visual: { id: "et2", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: expressions
        arguments:
          - { target: p, type: Integer, expr: 'record.values.stage == "Won" ? 100 : (record.values.stage == "Negotiation" ? 60 : (record.values.stage == "Proposal" ? 40 : (record.values.stage == "Qualified" ? 20 : (record.values.stage == "Lost" ? 0 : 10))))' }
          - { target: record.values.probability, type: Any, expr: "p" }
          - { target: record.values.forecast_amount, type: Any, expr: "float(coalesce(record.values.amount, 0)) * float(p) / 100" }
          - { target: record.values.is_closed, type: Any, expr: 'record.values.stage == "Won" || record.values.stage == "Lost"' }
          - { target: record.values.is_won, type: Any, expr: 'record.values.stage == "Won"' }
        meta:
          name: Probability and weighted amount
          visual: { id: "10", parent: "1", value: null, xywh: [250, 80, 0, 0] }
      - id: 20
        kind: gateway
        ref: excl
        meta:
          name: Just closed?
          visual: { id: "20", parent: "1", value: null, xywh: [500, 80, 0, 0] }
      - id: 30
        kind: expressions
        arguments:
          - { target: record.values.closed_at, type: Any, expr: "now()" }
        meta:
          name: Stamp closed at
          visual: { id: "30", parent: "1", value: null, xywh: [750, 0, 0, 0] }
      - id: 99
        kind: termination
        meta:
          name: Done
          visual: { id: "99", parent: "1", value: null, xywh: [1000, 80, 0, 0] }
    paths:
      - { parentid: 10, childid: 20, meta: { visual: { id: "p10_20", parent: "1", value: null, points: [] } } }
      - parentid: 20
        childid: 30
        expr: '(record.values.stage == "Won" || record.values.stage == "Lost") && isEmpty(record.values.closed_at)'
        meta: { name: Closed now, visual: { id: "p20_30", parent: "1", value: null, points: [] } }
      - parentid: 20
        childid: 99
        expr: ""
        meta: { name: Otherwise, visual: { id: "p20_99", parent: "1", value: null, points: [] } }
      - { parentid: 30, childid: 99, meta: { visual: { id: "p30_99", parent: "1", value: null, points: [] } } }

  # ===========================================================================
  # Contact: email intelligence, display name, lifecycle default, unsubscribe
  #
  # From john.smith@acme.com it fills First name "John", Last name "Smith"
  # (only when both are empty), sets Email domain "acme.com" and links the
  # Company whose domain is acme.com, creating it when none exists. Free
  # webmail domains and generic inboxes (info@, sales@...) are skipped.
  crm_contact_defaults:
    meta:
      name: "CRM: Contact defaults and email intelligence"
      description: Fills name, email domain and company from the email address, builds the display name, defaults lifecycle stage to Lead and stamps the unsubscribe time.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: beforeCreate
        enabled: true
        stepID: 1
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Contact] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 0, 0, 0]
            edges:
              - { parentID: "t1", childID: "1", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
      - resourceType: compose:record
        eventType: beforeUpdate
        enabled: true
        stepID: 1
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Contact] }
        meta:
          visual:
            id: "t2"
            parent: "1"
            xywh: [0, 160, 0, 0]
            edges:
              - { parentID: "t2", childID: "1", meta: { visual: { id: "et2", parent: "1", value: null, points: [] } } }
    steps:
      - id: 1
        kind: expressions
        arguments:
          - { target: email, type: String, expr: 'toLower(trim(coalesce(record.values.email, "")))' }
          - { target: validEmail, type: Boolean, expr: "isEmail(email)" }
          # appending separators guarantees enough elements for the indexes
          # below; results are indexed through a variable because the
          # expression parser can't index a function call directly
          - { target: atParts, type: Any, expr: 'split(email + "@", "@")' }
          - { target: local, type: String, expr: "atParts[0]" }
          - { target: domain, type: String, expr: "atParts[1]" }
          # hyphens are kept so jean-pascal.mollet stays Jean-Pascal Mollet
          - { target: parts, type: Any, expr: 'split(replace(local, "_", ".", -1) + "..", ".")' }
          - { target: generic, type: Boolean, expr: 'local in ["info", "sales", "hello", "hi", "contact", "admin", "support", "office", "team", "enquiries", "enquiry", "accounts", "billing", "hr", "jobs", "careers", "marketing", "noreply", "no-reply", "mail", "help", "service", "orders", "bookings", "reception"]' }
          - { target: freeMail, type: Boolean, expr: 'domain in ["gmail.com", "googlemail.com", "yahoo.com", "yahoo.co.uk", "ymail.com", "hotmail.com", "hotmail.co.uk", "outlook.com", "live.com", "live.co.uk", "msn.com", "icloud.com", "me.com", "mac.com", "aol.com", "proton.me", "protonmail.com", "gmx.com", "gmx.co.uk", "mail.com", "yandex.com", "zoho.com", "btinternet.com", "sky.com", "virginmedia.com", "talktalk.net"]' }
          - { target: nameable, type: Boolean, expr: 'validEmail && !generic && !match(local, "[0-9]")' }
        meta:
          name: Parse email address
          visual: { id: "1", parent: "1", value: null, xywh: [200, 80, 0, 0] }
      - id: 2
        kind: gateway
        ref: excl
        meta:
          name: Names empty?
          visual: { id: "2", parent: "1", value: null, xywh: [400, 80, 0, 0] }
      - id: 3
        kind: expressions
        arguments:
          - { target: record.values.first_name, type: Any, expr: "trim(title(parts[0]))" }
          - { target: record.values.last_name, type: Any, expr: 'trim(title(parts[2] != "" ? parts[2] : parts[1]))' }
        meta:
          name: Names from email
          visual: { id: "3", parent: "1", value: null, xywh: [600, 0, 0, 0] }
      - id: 4
        kind: gateway
        ref: excl
        meta:
          name: Company empty?
          visual: { id: "4", parent: "1", value: null, xywh: [800, 80, 0, 0] }
      - id: 5
        kind: expressions
        arguments:
          - { target: found, type: Boolean, value: "false" }
        meta:
          name: Look for company
          visual: { id: "5", parent: "1", value: null, xywh: [1000, 0, 0, 0] }
      - id: 6
        kind: iterator
        ref: composeRecordsEach
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Company }
          - { target: query, type: String, expr: "format(\"domain = '%s'\", domain)" }
          - { target: limit, type: UnsignedInteger, value: "1" }
        results:
          - { target: co, expr: "record" }
        meta:
          name: Company with this domain
          visual: { id: "6", parent: "1", value: null, xywh: [1200, 0, 0, 0] }
      - id: 7
        kind: expressions
        arguments:
          - { target: record.values.company, type: Any, expr: "co.ID" }
          - { target: found, type: Boolean, value: "true" }
        meta:
          name: Link existing company
          visual: { id: "7", parent: "1", value: null, xywh: [1400, -160, 0, 0] }
      - id: 71
        kind: break
        meta:
          name: Stop looking
          visual: { id: "71", parent: "1", value: null, xywh: [1600, -160, 0, 0] }
      - id: 8
        kind: gateway
        ref: excl
        meta:
          name: Found one?
          visual: { id: "8", parent: "1", value: null, xywh: [1400, 0, 0, 0] }
      - id: 81
        kind: function
        ref: composeRecordsNew
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Company }
        results:
          - { target: newCo, expr: "record" }
        meta:
          name: New company
          visual: { id: "81", parent: "1", value: null, xywh: [1600, 120, 0, 0] }
      - id: 82
        kind: expressions
        arguments:
          - { target: domParts, type: Any, expr: 'split(domain, ".")' }
          - { target: newCo.values.name, type: Any, expr: "trim(title(domParts[0]))" }
          - { target: newCo.values.domain, type: Any, expr: "domain" }
          - { target: newCo.values.website, type: Any, expr: '"https://" + domain' }
          - { target: newCo.values.lifecycle_stage, type: Any, value: Lead }
        meta:
          name: Company from domain
          visual: { id: "82", parent: "1", value: null, xywh: [1800, 120, 0, 0] }
      - id: 83
        kind: function
        ref: composeRecordsCreate
        arguments:
          - { target: record, type: ComposeRecord, expr: "newCo" }
        results:
          - { target: newCo, expr: "record" }
        meta:
          name: Save company
          visual: { id: "83", parent: "1", value: null, xywh: [2000, 120, 0, 0] }
      - id: 84
        kind: expressions
        arguments:
          - { target: record.values.company, type: Any, expr: "newCo.ID" }
        meta:
          name: Link new company
          visual: { id: "84", parent: "1", value: null, xywh: [2200, 120, 0, 0] }
      - id: 10
        kind: expressions
        arguments:
          - { target: fullName, type: String, expr: 'trim(coalesce(record.values.first_name, "") + " " + coalesce(record.values.last_name, ""))' }
          - { target: record.values.full_name, type: Any, expr: 'fullName == "" ? coalesce(record.values.email, "") : fullName' }
          - { target: record.values.lifecycle_stage, type: Any, expr: 'coalesce(record.values.lifecycle_stage, "Lead")' }
          - { target: record.values.email_domain, type: Any, expr: 'validEmail ? domain : ""' }
        meta:
          name: Name and lifecycle defaults
          visual: { id: "10", parent: "1", value: null, xywh: [2400, 80, 0, 0] }
      - id: 20
        kind: gateway
        ref: excl
        meta:
          name: Just unsubscribed?
          visual: { id: "20", parent: "1", value: null, xywh: [2600, 80, 0, 0] }
      - id: 30
        kind: expressions
        arguments:
          - { target: record.values.unsubscribed_at, type: Any, expr: "now()" }
        meta:
          name: Stamp unsubscribed at
          visual: { id: "30", parent: "1", value: null, xywh: [2800, 0, 0, 0] }
      - id: 99
        kind: termination
        meta:
          name: Done
          visual: { id: "99", parent: "1", value: null, xywh: [3000, 80, 0, 0] }
    paths:
      - { parentid: 1, childid: 2, meta: { visual: { id: "p1_2", parent: "1", value: null, points: [] } } }
      - parentid: 2
        childid: 3
        expr: "nameable && isEmpty(record.values.first_name) && isEmpty(record.values.last_name)"
        meta: { name: Fill names, visual: { id: "p2_3", parent: "1", value: null, points: [] } }
      - parentid: 2
        childid: 4
        expr: ""
        meta: { name: Keep names, visual: { id: "p2_4", parent: "1", value: null, points: [] } }
      - { parentid: 3, childid: 4, meta: { visual: { id: "p3_4", parent: "1", value: null, points: [] } } }
      - parentid: 4
        childid: 5
        expr: "validEmail && !freeMail && isEmpty(record.values.company)"
        meta: { name: Link company, visual: { id: "p4_5", parent: "1", value: null, points: [] } }
      - parentid: 4
        childid: 10
        expr: ""
        meta: { name: Keep company, visual: { id: "p4_10", parent: "1", value: null, points: [] } }
      - { parentid: 5, childid: 6, meta: { visual: { id: "p5_6", parent: "1", value: null, points: [] } } }
      # iterator: first path is the loop body, second is taken when done
      - { parentid: 6, childid: 7, meta: { name: Loop, visual: { id: "p6_7", parent: "1", value: null, points: [] } } }
      - { parentid: 6, childid: 8, meta: { name: Done, visual: { id: "p6_8", parent: "1", value: null, points: [] } } }
      - { parentid: 7, childid: 71, meta: { visual: { id: "p7_71", parent: "1", value: null, points: [] } } }
      - parentid: 8
        childid: 10
        expr: "found"
        meta: { name: Yes, visual: { id: "p8_10", parent: "1", value: null, points: [] } }
      - parentid: 8
        childid: 81
        expr: ""
        meta: { name: No, visual: { id: "p8_81", parent: "1", value: null, points: [] } }
      - { parentid: 81, childid: 82, meta: { visual: { id: "p81_82", parent: "1", value: null, points: [] } } }
      - { parentid: 82, childid: 83, meta: { visual: { id: "p82_83", parent: "1", value: null, points: [] } } }
      - { parentid: 83, childid: 84, meta: { visual: { id: "p83_84", parent: "1", value: null, points: [] } } }
      - { parentid: 84, childid: 10, meta: { visual: { id: "p84_10", parent: "1", value: null, points: [] } } }
      - { parentid: 10, childid: 20, meta: { visual: { id: "p10_20", parent: "1", value: null, points: [] } } }
      - parentid: 20
        childid: 30
        expr: "record.values.email_opt_out == true && isEmpty(record.values.unsubscribed_at)"
        meta: { name: Opted out, visual: { id: "p20_30", parent: "1", value: null, points: [] } }
      - parentid: 20
        childid: 99
        expr: ""
        meta: { name: Otherwise, visual: { id: "p20_99", parent: "1", value: null, points: [] } }
      - { parentid: 30, childid: 99, meta: { visual: { id: "p30_99", parent: "1", value: null, points: [] } } }

  # ===========================================================================
  # Company: derive the email domain from the website
  crm_company_defaults:
    meta:
      name: "CRM: Company defaults"
      description: Fills the company email domain from its website (https://www.acme.com/about -> acme.com) when it is empty.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: beforeCreate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Company] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 0, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
      - resourceType: compose:record
        eventType: beforeUpdate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Company] }
        meta:
          visual:
            id: "t2"
            parent: "1"
            xywh: [0, 160, 0, 0]
            edges:
              - { parentID: "t2", childID: "10", meta: { visual: { id: "et2", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: gateway
        ref: excl
        meta:
          name: Domain empty?
          visual: { id: "10", parent: "1", value: null, xywh: [250, 80, 0, 0] }
      - id: 20
        kind: expressions
        arguments:
          - { target: w1, type: String, expr: 'replace(replace(toLower(trim(format("%v", record.values.website))), "https://", "", 1), "http://", "", 1)' }
          - { target: w2, type: String, expr: 'hasPrefix(w1, "www.") ? substring(w1, 4, -1) : w1' }
          - { target: w3, type: Any, expr: 'split(w2 + "/", "/")' }
          - { target: w4, type: Any, expr: 'split(w3[0] + ":", ":")' }
          - { target: record.values.domain, type: Any, expr: "w4[0]" }
        meta:
          name: Domain from website
          visual: { id: "20", parent: "1", value: null, xywh: [500, 0, 0, 0] }
      - id: 99
        kind: termination
        meta:
          name: Done
          visual: { id: "99", parent: "1", value: null, xywh: [750, 80, 0, 0] }
    paths:
      - parentid: 10
        childid: 20
        expr: "isEmpty(record.values.domain) && !isEmpty(record.values.website)"
        meta: { name: Fill domain, visual: { id: "p10_20", parent: "1", value: null, points: [] } }
      - parentid: 10
        childid: 99
        expr: ""
        meta: { name: Otherwise, visual: { id: "p10_99", parent: "1", value: null, points: [] } }
      - { parentid: 20, childid: 99, meta: { visual: { id: "p20_99", parent: "1", value: null, points: [] } } }

  # ===========================================================================
  # Email template: build the preview frame URL from the pasted HTML
  crm_email_template_preview:
    meta:
      name: "CRM: Email template preview"
      description: On save, turns the template HTML into a data URL shown in the preview frame next to the editor.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: beforeCreate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [EmailTemplate] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 0, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
      - resourceType: compose:record
        eventType: beforeUpdate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [EmailTemplate] }
        meta:
          visual:
            id: "t2"
            parent: "1"
            xywh: [0, 160, 0, 0]
            edges:
              - { parentID: "t2", childID: "10", meta: { visual: { id: "et2", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: expressions
        arguments:
          - { target: html, type: String, expr: 'coalesce(record.values.body_html, "<p style=\"font-family:sans-serif;color:#64748B;padding:24px\">Paste your HTML on the left and click Save to see the preview here.</p>")' }
          # the src=:// parameter keeps the page block from prefixing http://
          - { target: record.values.preview_url, type: Any, expr: '"data:text/html;charset=utf-8;src=://dmcrm;base64," + base64encode(html)' }
        meta:
          name: Build preview
          visual: { id: "10", parent: "1", value: null, xywh: [250, 80, 0, 0] }
    paths: []

  # ===========================================================================
  # Deal won: promote the primary contact and company to Customer
  crm_deal_won:
    meta:
      name: "CRM: Deal won -> customer"
      description: When a deal moves to Won, sets the linked contact and company lifecycle stage to Customer.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: afterUpdate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Deal] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 80, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: gateway
        ref: excl
        meta:
          name: Just won?
          visual: { id: "10", parent: "1", value: null, xywh: [200, 80, 0, 0] }
      - id: 20
        kind: gateway
        ref: excl
        meta:
          name: Has contact?
          visual: { id: "20", parent: "1", value: null, xywh: [400, 80, 0, 0] }
      - id: 30
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Contact }
          - { target: record, type: ID, expr: "record.values.contact" }
        results:
          - { target: contact, expr: "record" }
        meta:
          name: Load contact
          visual: { id: "30", parent: "1", value: null, xywh: [600, 0, 0, 0] }
      - id: 31
        kind: expressions
        arguments:
          - { target: contact.values.lifecycle_stage, type: Any, value: Customer }
        meta:
          name: Contact is a customer
          visual: { id: "31", parent: "1", value: null, xywh: [800, 0, 0, 0] }
      - id: 32
        kind: function
        ref: composeRecordsUpdate
        arguments:
          - { target: record, type: ComposeRecord, expr: "contact" }
        meta:
          name: Save contact
          visual: { id: "32", parent: "1", value: null, xywh: [1000, 0, 0, 0] }
      - id: 50
        kind: gateway
        ref: excl
        meta:
          name: Has company?
          visual: { id: "50", parent: "1", value: null, xywh: [1200, 80, 0, 0] }
      - id: 60
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Company }
          - { target: record, type: ID, expr: "record.values.company" }
        results:
          - { target: company, expr: "record" }
        meta:
          name: Load company
          visual: { id: "60", parent: "1", value: null, xywh: [1400, 0, 0, 0] }
      - id: 61
        kind: expressions
        arguments:
          - { target: company.values.lifecycle_stage, type: Any, value: Customer }
        meta:
          name: Company is a customer
