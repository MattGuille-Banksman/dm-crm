  # ===========================================================================
  # Campaign: recount engagement from recipient rows
  crm_campaign_refresh_stats:
    meta:
      name: "CRM: Campaign - refresh stats"
      description: Recounts sent, opened, clicked, bounced and unsubscribed recipients onto the campaign record.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: onManual
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [EmailCampaign] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 80, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: expressions
        arguments:
          - { target: total, type: Integer, value: "0" }
          - { target: sent, type: Integer, value: "0" }
          - { target: opened, type: Integer, value: "0" }
          - { target: clicked, type: Integer, value: "0" }
          - { target: bounced, type: Integer, value: "0" }
          - { target: unsub, type: Integer, value: "0" }
        meta:
          name: Init counters
          visual: { id: "10", parent: "1", value: null, xywh: [200, 80, 0, 0] }
      - id: 20
        kind: iterator
        ref: composeRecordsEach
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: CampaignRecipient }
          - { target: query, type: String, expr: 'format("campaign = %v", record.ID)' }
        results:
          - { target: r, expr: "record" }
        meta:
          name: Each recipient
          visual: { id: "20", parent: "1", value: null, xywh: [400, 80, 0, 0] }
      - id: 30
        kind: expressions
        arguments:
          - { target: total, type: Integer, expr: "total + 1" }
          - { target: sent, type: Integer, expr: "sent + (isEmpty(r.values.sent_at) ? 0 : 1)" }
          - { target: opened, type: Integer, expr: "opened + (isEmpty(r.values.opened_at) ? 0 : 1)" }
          - { target: clicked, type: Integer, expr: "clicked + (isEmpty(r.values.clicked_at) ? 0 : 1)" }
          - { target: bounced, type: Integer, expr: 'bounced + (r.values.status == "Bounced" ? 1 : 0)' }
          - { target: unsub, type: Integer, expr: 'unsub + (r.values.status == "Unsubscribed" ? 1 : 0)' }
        meta:
          name: Count
          visual: { id: "30", parent: "1", value: null, xywh: [600, 0, 0, 0] }
      - id: 35
        kind: continue
        meta:
          name: Next recipient
          visual: { id: "35", parent: "1", value: null, xywh: [800, 0, 0, 0] }
      - id: 40
        kind: expressions
        arguments:
          - { target: record.values.recipients_count, type: Any, expr: "total" }
          - { target: record.values.sent_count, type: Any, expr: "sent" }
          - { target: record.values.opened_count, type: Any, expr: "opened" }
          - { target: record.values.clicked_count, type: Any, expr: "clicked" }
          - { target: record.values.bounced_count, type: Any, expr: "bounced" }
          - { target: record.values.unsubscribed_count, type: Any, expr: "unsub" }
        meta:
          name: Copy to campaign
          visual: { id: "40", parent: "1", value: null, xywh: [600, 200, 0, 0] }
      - id: 45
        kind: function
        ref: composeRecordsUpdate
        arguments:
          - { target: record, type: ComposeRecord, expr: "record" }
        meta:
          name: Save campaign
          visual: { id: "45", parent: "1", value: null, xywh: [800, 200, 0, 0] }
      - id: 50
        kind: prompt
        ref: notification
        arguments:
          - { target: title, type: String, value: Stats updated }
          - { target: message, type: String, expr: 'format("%v recipients: %v sent, %v opened, %v clicked.", total, sent, opened, clicked)' }
          - { target: variant, type: String, value: info }
        meta:
          name: Tell the user
          visual: { id: "50", parent: "1", value: null, xywh: [1000, 200, 0, 0] }
    paths:
      - { parentid: 10, childid: 20, meta: { visual: { id: "p10_20", parent: "1", value: null, points: [] } } }
      # iterator: first path is the loop body, second is taken when done
      - { parentid: 20, childid: 30, meta: { name: Loop, visual: { id: "p20_30", parent: "1", value: null, points: [] } } }
      - { parentid: 20, childid: 40, meta: { name: Done, visual: { id: "p20_40", parent: "1", value: null, points: [] } } }
      - { parentid: 30, childid: 35, meta: { visual: { id: "p30_35", parent: "1", value: null, points: [] } } }
      - { parentid: 40, childid: 45, meta: { visual: { id: "p40_45", parent: "1", value: null, points: [] } } }
      - { parentid: 45, childid: 50, meta: { visual: { id: "p45_50", parent: "1", value: null, points: [] } } }

  # ===========================================================================
  # Recipient engagement: stamp timestamps/counters when the status changes.
  # Webhooks (ESP events, tracking endpoint) only need to PATCH the status.
  crm_recipient_engagement:
    meta:
      name: "CRM: Recipient engagement"
      description: Stamps opened/clicked/bounced/unsubscribed timestamps and counters when a recipient status changes; unsubscribes also opt the contact out.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: beforeUpdate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [CampaignRecipient] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 240, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: gateway
        ref: excl
        meta:
          name: Status changed to
          visual: { id: "10", parent: "1", value: null, xywh: [200, 240, 0, 0] }
      - id: 20
        kind: expressions
        arguments:
          - { target: record.values.opened_at, type: Any, expr: "coalesce(record.values.opened_at, now())" }
          - { target: record.values.open_count, type: Any, expr: "float(coalesce(record.values.open_count, 0)) + 1" }
        meta:
          name: Opened
          visual: { id: "20", parent: "1", value: null, xywh: [450, 0, 0, 0] }
      - id: 30
        kind: expressions
        arguments:
          - { target: record.values.opened_at, type: Any, expr: "coalesce(record.values.opened_at, now())" }
          - { target: record.values.clicked_at, type: Any, expr: "coalesce(record.values.clicked_at, now())" }
          - { target: record.values.click_count, type: Any, expr: "float(coalesce(record.values.click_count, 0)) + 1" }
        meta:
          name: Clicked
          visual: { id: "30", parent: "1", value: null, xywh: [450, 160, 0, 0] }
      - id: 40
        kind: expressions
        arguments:
          - { target: record.values.bounced_at, type: Any, expr: "coalesce(record.values.bounced_at, now())" }
        meta:
          name: Bounced
          visual: { id: "40", parent: "1", value: null, xywh: [450, 320, 0, 0] }
      - id: 50
        kind: expressions
        arguments:
          - { target: record.values.unsubscribed_at, type: Any, expr: "coalesce(record.values.unsubscribed_at, now())" }
        meta:
          name: Unsubscribed
          visual: { id: "50", parent: "1", value: null, xywh: [450, 480, 0, 0] }
      - id: 55
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Contact }
          - { target: record, type: ID, expr: "record.values.contact" }
        results:
          - { target: contact, expr: "record" }
        meta:
          name: Load contact
          visual: { id: "55", parent: "1", value: null, xywh: [700, 480, 0, 0] }
      - id: 56
        kind: expressions
        arguments:
          - { target: contact.values.email_opt_out, type: Any, expr: "true" }
          - { target: contact.values.unsubscribed_at, type: Any, expr: "now()" }
        meta:
          name: Opt contact out
          visual: { id: "56", parent: "1", value: null, xywh: [950, 480, 0, 0] }
      - id: 57
        kind: function
        ref: composeRecordsUpdate
        arguments:
          - { target: record, type: ComposeRecord, expr: "contact" }
        meta:
          name: Save contact
          visual: { id: "57", parent: "1", value: null, xywh: [1200, 480, 0, 0] }
      - id: 99
        kind: termination
        meta:
          name: Done
          visual: { id: "99", parent: "1", value: null, xywh: [1450, 240, 0, 0] }
    paths:
      - parentid: 10
        childid: 20
        expr: 'record.values.status == "Opened" && oldRecord.values.status != "Opened"'
        meta: { name: Opened, visual: { id: "p10_20", parent: "1", value: null, points: [] } }
      - parentid: 10
        childid: 30
        expr: 'record.values.status == "Clicked" && oldRecord.values.status != "Clicked"'
        meta: { name: Clicked, visual: { id: "p10_30", parent: "1", value: null, points: [] } }
      - parentid: 10
        childid: 40
        expr: 'record.values.status == "Bounced" && oldRecord.values.status != "Bounced"'
        meta: { name: Bounced, visual: { id: "p10_40", parent: "1", value: null, points: [] } }
      - parentid: 10
        childid: 50
        expr: 'record.values.status == "Unsubscribed" && oldRecord.values.status != "Unsubscribed"'
        meta: { name: Unsubscribed, visual: { id: "p10_50", parent: "1", value: null, points: [] } }
      - parentid: 10
        childid: 99
        expr: ""
        meta: { name: Otherwise, visual: { id: "p10_99", parent: "1", value: null, points: [] } }
      - { parentid: 20, childid: 99, meta: { visual: { id: "p20_99", parent: "1", value: null, points: [] } } }
      - { parentid: 30, childid: 99, meta: { visual: { id: "p30_99", parent: "1", value: null, points: [] } } }
      - { parentid: 40, childid: 99, meta: { visual: { id: "p40_99", parent: "1", value: null, points: [] } } }
      - { parentid: 50, childid: 55, meta: { visual: { id: "p50_55", parent: "1", value: null, points: [] } } }
      - { parentid: 55, childid: 56, meta: { visual: { id: "p55_56", parent: "1", value: null, points: [] } } }
      - { parentid: 56, childid: 57, meta: { visual: { id: "p56_57", parent: "1", value: null, points: [] } } }
      - { parentid: 57, childid: 99, meta: { visual: { id: "p57_99", parent: "1", value: null, points: [] } } }

  # ===========================================================================
  # Deal won webhook (API call node). Disabled until you set the URL.
  crm_deal_won_webhook:
    meta:
      name: "CRM: Deal won webhook"
      description: POSTs the won deal as JSON to an external endpoint. Disabled by default; set the URL in the HTTP request step and enable.
    enabled: false
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: afterUpdate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Deal] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 80, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: gateway
        ref: excl
        meta:
          name: Just won?
          visual: { id: "10", parent: "1", value: null, xywh: [200, 80, 0, 0] }
      - id: 20
        kind: function
        ref: httpRequestSend
        arguments:
          - { target: url, type: String, value: "https://example.com/webhooks/crm/deal-won" }
