      - { id: 30, kind: function, ref: composeRecordsNew, arguments: [ { target: namespace, type: Handle, value: crm }, { target: module, type: Handle, value: DealStage } ], results: [ { target: s, expr: "record" } ], meta: { name: "Qualified", visual: { id: "30", parent: "1", value: null, xywh: [800, 0, 0, 0] } } }
      - { id: 31, kind: expressions, arguments: [ { target: s.values.name, type: Any, value: Qualified }, { target: s.values.position, type: Any, value: "2" }, { target: s.values.probability, type: Any, value: "20" } ], meta: { name: "Qualified: values", visual: { id: "31", parent: "1", value: null, xywh: [800, 120, 0, 0] } } }
      - { id: 32, kind: function, ref: composeRecordsCreate, arguments: [ { target: record, type: ComposeRecord, expr: "s" } ], meta: { name: "Qualified: save", visual: { id: "32", parent: "1", value: null, xywh: [800, 240, 0, 0] } } }
