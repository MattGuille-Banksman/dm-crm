  # ===========================================================================
  # Campaign: build the recipient list from the audience filter
  crm_campaign_build_recipients:
    meta:
      name: "CRM: Campaign - build recipients"
      description: Queues one CampaignRecipient per contact in the campaign segment (and optional extra filter), skipping opted-out contacts and contacts without email.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: onManual
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [EmailCampaign] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 80, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: gateway
        ref: excl
        meta:
          name: Can build?
          visual: { id: "10", parent: "1", value: null, xywh: [200, 80, 0, 0] }
      - id: 15
        kind: error
        arguments:
          - { target: message, type: String, value: "Recipients can be built only once, for Draft or Scheduled campaigns." }
        meta:
          name: Not allowed
          visual: { id: "15", parent: "1", value: null, xywh: [200, 280, 0, 0] }
      - id: 16
        kind: gateway
        ref: excl
        meta:
          name: Has audience?
          visual: { id: "16", parent: "1", value: null, xywh: [200, 440, 0, 0] }
      - id: 18
        kind: error
        arguments:
          - { target: message, type: String, value: "Pick an audience segment (or an extra audience filter) first." }
        meta:
          name: No audience
          visual: { id: "18", parent: "1", value: null, xywh: [200, 640, 0, 0] }
      - id: 17
        kind: expressions
        arguments:
          - { target: queued, type: Integer, value: "0" }
          - { target: extra, type: String, expr: 'coalesce(record.values.audience_query, "")' }
          - { target: base, type: String, value: "" }
          - { target: ids, type: Array, expr: "[]" }
        meta:
          name: Init
          visual: { id: "17", parent: "1", value: null, xywh: [400, 440, 0, 0] }
      - id: 19
        kind: gateway
        ref: excl
        meta:
          name: Uses a segment?
          visual: { id: "19", parent: "1", value: null, xywh: [600, 440, 0, 0] }
      - id: 21
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Segment }
          - { target: record, type: ID, expr: "record.values.segment" }
        results:
          - { target: seg, expr: "record" }
        meta:
          name: Load segment
          visual: { id: "21", parent: "1", value: null, xywh: [800, 440, 0, 0] }
      - id: 22
        kind: gateway
        ref: excl
        meta:
          name: Static list?
          visual: { id: "22", parent: "1", value: null, xywh: [1000, 440, 0, 0] }
      - id: 23
        kind: iterator
        ref: composeRecordsEach
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: SegmentMember }
          - { target: query, type: String, expr: 'format("segment = %v", seg.ID)' }
        results:
          - { target: m, expr: "record" }
        meta:
          name: Each saved member
          visual: { id: "23", parent: "1", value: null, xywh: [1200, 360, 0, 0] }
      - id: 24
        kind: expressions
        arguments:
          - { target: ids, type: Array, expr: 'push(ids, format("%v", m.values.contact))' }
        meta:
          name: Collect contact
          visual: { id: "24", parent: "1", value: null, xywh: [1400, 280, 0, 0] }
      - id: 241
        kind: continue
        meta:
          name: Next member
          visual: { id: "241", parent: "1", value: null, xywh: [1600, 280, 0, 0] }
      - id: 25
        kind: gateway
        ref: excl
        meta:
          name: Any members?
          visual: { id: "25", parent: "1", value: null, xywh: [1400, 440, 0, 0] }
      - id: 251
        kind: expressions
        arguments:
          - { target: base, type: String, expr: 'format("recordID IN (%s)", join(ids, ","))' }
        meta:
          name: Members as filter
          visual: { id: "251", parent: "1", value: null, xywh: [1600, 440, 0, 0] }
      - id: 252
        kind: error
        arguments:
          - { target: message, type: String, value: "This static segment has no members yet. Add contacts or take a snapshot first." }
        meta:
          name: Empty list
          visual: { id: "252", parent: "1", value: null, xywh: [1400, 640, 0, 0] }
      - id: 26
        kind: expressions
        arguments:
          - { target: base, type: String, expr: 'coalesce(seg.values.filter, "")' }
        meta:
