  # ===========================================================================
  # Setup: create the default pipeline stages (Settings page button)
  crm_setup_default_stages:
    meta:
      name: "CRM: Setup - default deal stages"
      description: Creates the six default DealStage records (New, Qualified, Proposal, Negotiation, Won, Lost) if none exist.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:namespace
        eventType: onManual
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 80, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: function
        ref: composeRecordsSearch
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: DealStage }
          - { target: limit, type: UnsignedInteger, value: "1" }
          - { target: incTotal, type: Boolean, value: "true" }
