  # ===========================================================================
  # Contact rollup: deal counts and values, for segmentation
  crm_contact_deal_rollup:
    meta:
      name: "CRM: Contact deal stats"
      description: Recalculates deals, open deals, won deals, open pipeline and won revenue on the contact whenever one of their deals changes.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: afterCreate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Deal] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 0, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
      - resourceType: compose:record
        eventType: afterUpdate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Deal] }
        meta:
          visual:
            id: "t2"
            parent: "1"
            xywh: [0, 160, 0, 0]
            edges:
              - { parentID: "t2", childID: "10", meta: { visual: { id: "et2", parent: "1", value: null, points: [] } } }
      - resourceType: compose:record
        eventType: afterDelete
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Deal] }
        meta:
          visual:
            id: "t3"
            parent: "1"
            xywh: [0, 320, 0, 0]
            edges:
              - { parentID: "t3", childID: "10", meta: { visual: { id: "et3", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: gateway
        ref: excl
        meta:
          name: Has contact?
          visual: { id: "10", parent: "1", value: null, xywh: [200, 160, 0, 0] }
      - id: 20
        kind: expressions
        arguments:
          - { target: cid, type: Any, expr: "record.values.contact" }
          - { target: deals, type: Integer, value: "0" }
          - { target: open, type: Integer, value: "0" }
          - { target: won, type: Integer, value: "0" }
          - { target: pipe, type: Float, value: "0" }
          - { target: rev, type: Float, value: "0" }
        meta:
          name: Init
          visual: { id: "20", parent: "1", value: null, xywh: [400, 160, 0, 0] }
      - id: 30
        kind: iterator
        ref: composeRecordsEach
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Deal }
          - { target: query, type: String, expr: 'format("contact = %v", cid)' }
        results:
          - { target: d, expr: "record" }
        meta:
          name: Each deal of contact
          visual: { id: "30", parent: "1", value: null, xywh: [600, 160, 0, 0] }
      - id: 40
        kind: expressions
        arguments:
          - { target: isOpen, type: Boolean, expr: 'd.values.stage != "Won" && d.values.stage != "Lost"' }
          - { target: deals, type: Integer, expr: "deals + 1" }
          - { target: open, type: Integer, expr: "open + (isOpen ? 1 : 0)" }
          - { target: won, type: Integer, expr: 'won + (d.values.stage == "Won" ? 1 : 0)' }
          - { target: pipe, type: Float, expr: "pipe + (isOpen ? float(coalesce(d.values.amount, 0)) : 0)" }
          - { target: rev, type: Float, expr: 'rev + (d.values.stage == "Won" ? float(coalesce(d.values.amount, 0)) : 0)' }
        meta:
          name: Add up
          visual: { id: "40", parent: "1", value: null, xywh: [800, 0, 0, 0] }
      - id: 41
        kind: continue
        meta:
          name: Next deal
          visual: { id: "41", parent: "1", value: null, xywh: [1000, 0, 0, 0] }
      - id: 50
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Contact }
          - { target: record, type: ID, expr: "cid" }
        results:
          - { target: c, expr: "record" }
        meta:
          name: Load contact
          visual: { id: "50", parent: "1", value: null, xywh: [800, 320, 0, 0] }
      - id: 51
        kind: expressions
        arguments:
          - { target: c.values.deals_count, type: Any, expr: "deals" }
          - { target: c.values.open_deals_count, type: Any, expr: "open" }
          - { target: c.values.won_deals_count, type: Any, expr: "won" }
          - { target: c.values.open_pipeline, type: Any, expr: "pipe" }
          - { target: c.values.won_revenue, type: Any, expr: "rev" }
        meta:
          name: Store stats
          visual: { id: "51", parent: "1", value: null, xywh: [1000, 320, 0, 0] }
      - id: 52
        kind: function
        ref: composeRecordsUpdate
        arguments:
          - { target: record, type: ComposeRecord, expr: "c" }
        meta:
          name: Save contact
          visual: { id: "52", parent: "1", value: null, xywh: [1200, 320, 0, 0] }
      - id: 99
        kind: termination
        meta:
          name: Done
          visual: { id: "99", parent: "1", value: null, xywh: [1400, 160, 0, 0] }
    paths:
      - parentid: 10
        childid: 20
        expr: "!isEmpty(record.values.contact)"
        meta: { name: Yes, visual: { id: "p10_20", parent: "1", value: null, points: [] } }
      - parentid: 10
        childid: 99
        expr: ""
        meta: { name: No, visual: { id: "p10_99", parent: "1", value: null, points: [] } }
      - { parentid: 20, childid: 30, meta: { visual: { id: "p20_30", parent: "1", value: null, points: [] } } }
      # iterator: first path is the loop body, second is taken when done
      - { parentid: 30, childid: 40, meta: { name: Loop, visual: { id: "p30_40", parent: "1", value: null, points: [] } } }
      - { parentid: 30, childid: 50, meta: { name: Done, visual: { id: "p30_50", parent: "1", value: null, points: [] } } }
      - { parentid: 40, childid: 41, meta: { visual: { id: "p40_41", parent: "1", value: null, points: [] } } }
      - { parentid: 50, childid: 51, meta: { visual: { id: "p50_51", parent: "1", value: null, points: [] } } }
      - { parentid: 51, childid: 52, meta: { visual: { id: "p51_52", parent: "1", value: null, points: [] } } }
      - { parentid: 52, childid: 99, meta: { visual: { id: "p52_99", parent: "1", value: null, points: [] } } }

  # ===========================================================================
  # Contact rollup: marketing email engagement, for segmentation
  crm_contact_email_rollup:
    meta:
      name: "CRM: Contact email stats"
      description: Recalculates marketing emails sent, opened and clicked, and the last open and click time, on the recipient's contact.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: afterUpdate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [CampaignRecipient] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 160, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: gateway
        ref: excl
        meta:
          name: Status changed?
          visual: { id: "10", parent: "1", value: null, xywh: [200, 160, 0, 0] }
      - id: 20
        kind: expressions
        arguments:
          - { target: cid, type: Any, expr: "record.values.contact" }
          - { target: sent, type: Integer, value: "0" }
          - { target: opened, type: Integer, value: "0" }
          - { target: clicked, type: Integer, value: "0" }
          - { target: lastOpen, type: DateTime, value: "1970-01-01T00:00:00Z" }
          - { target: lastClick, type: DateTime, value: "1970-01-01T00:00:00Z" }
        meta:
          name: Init
          visual: { id: "20", parent: "1", value: null, xywh: [400, 160, 0, 0] }
      - id: 30
        kind: iterator
        ref: composeRecordsEach
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: CampaignRecipient }
          - { target: query, type: String, expr: 'format("contact = %v", cid)' }
        results:
          - { target: r, expr: "record" }
        meta:
          name: Each email to contact
          visual: { id: "30", parent: "1", value: null, xywh: [600, 160, 0, 0] }
      - id: 40
        kind: expressions
        arguments:
          - { target: sent, type: Integer, expr: "sent + (isEmpty(r.values.sent_at) ? 0 : 1)" }
          - { target: opened, type: Integer, expr: "opened + (isEmpty(r.values.opened_at) ? 0 : 1)" }
          - { target: clicked, type: Integer, expr: "clicked + (isEmpty(r.values.clicked_at) ? 0 : 1)" }
          - { target: lastOpen, type: DateTime, expr: "isEmpty(r.values.opened_at) ? lastOpen : latest(lastOpen, r.values.opened_at)" }
          - { target: lastClick, type: DateTime, expr: "isEmpty(r.values.clicked_at) ? lastClick : latest(lastClick, r.values.clicked_at)" }
        meta:
          name: Add up
          visual: { id: "40", parent: "1", value: null, xywh: [800, 0, 0, 0] }
      - id: 41
        kind: continue
