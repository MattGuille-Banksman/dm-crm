  # ===========================================================================
  # Campaign: send to every queued recipient
  #
  # Sender address is Corteza's configured SMTP sender (SMTP_FROM). Merge tags
  # {{first_name}} {{last_name}} {{full_name}} {{email}} are replaced in the
  # subject, HTML and plain-text bodies.
  crm_campaign_send:
    meta:
      name: "CRM: Campaign - send"
      description: Sends the campaign template to every Queued recipient, skipping opted-out contacts, and marks recipients and the campaign as Sent.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: onManual
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [EmailCampaign] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 80, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: gateway
        ref: excl
        meta:
          name: Ready to send?
          visual: { id: "10", parent: "1", value: null, xywh: [200, 80, 0, 0] }
      - id: 15
        kind: error
        arguments:
          - { target: message, type: String, value: "Campaign must be Scheduled (build the recipient list first) and have a template." }
        meta:
          name: Not ready
          visual: { id: "15", parent: "1", value: null, xywh: [200, 280, 0, 0] }
      - id: 20
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: EmailTemplate }
          - { target: record, type: ID, expr: "record.values.template" }
        results:
          - { target: tpl, expr: "record" }
        meta:
          name: Load template
          visual: { id: "20", parent: "1", value: null, xywh: [400, 80, 0, 0] }
      - id: 25
        kind: expressions
        arguments:
          - { target: subjectTpl, type: String, expr: 'coalesce(record.values.subject, tpl.values.subject, "")' }
          - { target: htmlTpl, type: String, expr: 'coalesce(tpl.values.body_html, "")' }
          - { target: textTpl, type: String, expr: 'coalesce(tpl.values.body_text, "")' }
          - { target: sent, type: Integer, value: "0" }
          - { target: skipped, type: Integer, value: "0" }
          - { target: record.values.status, type: Any, value: Sending }
        meta:
          name: Prepare
          visual: { id: "25", parent: "1", value: null, xywh: [600, 80, 0, 0] }
      - id: 26
        kind: function
        ref: composeRecordsUpdate
        arguments:
          - { target: record, type: ComposeRecord, expr: "record" }
        meta:
          name: Mark campaign Sending
          visual: { id: "26", parent: "1", value: null, xywh: [800, 80, 0, 0] }
      - id: 30
        kind: iterator
        ref: composeRecordsEach
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: CampaignRecipient }
          - { target: query, type: String, expr: 'format("campaign = %v AND status = ''Queued''", record.ID)' }
        results:
          - { target: rcp, expr: "record" }
        meta:
          name: Each queued recipient
          visual: { id: "30", parent: "1", value: null, xywh: [1000, 80, 0, 0] }
      - id: 40
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Contact }
          - { target: record, type: ID, expr: "rcp.values.contact" }
        results:
          - { target: c, expr: "record" }
        meta:
          name: Load contact
          visual: { id: "40", parent: "1", value: null, xywh: [1200, 0, 0, 0] }
      - id: 45
        kind: gateway
        ref: excl
        meta:
          name: Still mailable?
          visual: { id: "45", parent: "1", value: null, xywh: [1400, 0, 0, 0] }
      - id: 46
        kind: expressions
        arguments:
          - { target: rcp.values.status, type: Any, value: Skipped }
          - { target: rcp.values.error, type: Any, value: Contact unsubscribed or has no email address }
          - { target: skipped, type: Integer, expr: "skipped + 1" }
        meta:
          name: Mark skipped
          visual: { id: "46", parent: "1", value: null, xywh: [1400, -200, 0, 0] }
      - id: 47
        kind: function
        ref: composeRecordsUpdate
        arguments:
          - { target: record, type: ComposeRecord, expr: "rcp" }
        meta:
          name: Save recipient
          visual: { id: "47", parent: "1", value: null, xywh: [1600, -200, 0, 0] }
      - id: 48
        kind: continue
        meta:
          name: Next recipient
          visual: { id: "48", parent: "1", value: null, xywh: [1800, -200, 0, 0] }
      - id: 50
        kind: expressions
        arguments:
          - { target: name, type: String, expr: 'coalesce(c.values.full_name, c.values.email, "")' }
          - { target: s1, type: String, expr: 'replace(subjectTpl, "{{first_name}}", coalesce(c.values.first_name, ""), -1)' }
          - { target: s2, type: String, expr: 'replace(s1, "{{last_name}}", coalesce(c.values.last_name, ""), -1)' }
          - { target: s3, type: String, expr: 'replace(s2, "{{full_name}}", name, -1)' }
          - { target: subject, type: String, expr: 'replace(s3, "{{email}}", c.values.email, -1)' }
          - { target: h1, type: String, expr: 'replace(htmlTpl, "{{first_name}}", coalesce(c.values.first_name, ""), -1)' }
          - { target: h2, type: String, expr: 'replace(h1, "{{last_name}}", coalesce(c.values.last_name, ""), -1)' }
          - { target: h3, type: String, expr: 'replace(h2, "{{full_name}}", name, -1)' }
          - { target: html, type: String, expr: 'replace(h3, "{{email}}", c.values.email, -1)' }
          - { target: p1, type: String, expr: 'replace(textTpl, "{{first_name}}", coalesce(c.values.first_name, ""), -1)' }
          - { target: p2, type: String, expr: 'replace(p1, "{{last_name}}", coalesce(c.values.last_name, ""), -1)' }
          - { target: p3, type: String, expr: 'replace(p2, "{{full_name}}", name, -1)' }
          - { target: plain, type: String, expr: 'replace(p3, "{{email}}", c.values.email, -1)' }
        meta:
          name: Render merge tags
          visual: { id: "50", parent: "1", value: null, xywh: [1600, 0, 0, 0] }
      - id: 55
        kind: function
        ref: emailSend
        arguments:
          - { target: subject, type: String, expr: "subject" }
          - { target: to, type: String, expr: "c.values.email" }
          - { target: html, type: String, expr: "html" }
          - { target: plain, type: String, expr: "plain" }
        meta:
          name: Send email
          visual: { id: "55", parent: "1", value: null, xywh: [1800, 0, 0, 0] }
      - id: 60
        kind: expressions
        arguments:
          - { target: rcp.values.status, type: Any, value: Sent }
          - { target: rcp.values.sent_at, type: Any, expr: "now()" }
          - { target: rcp.values.email, type: Any, expr: "c.values.email" }
          - { target: sent, type: Integer, expr: "sent + 1" }
        meta:
          name: Mark sent
          visual: { id: "60", parent: "1", value: null, xywh: [2000, 0, 0, 0] }
      - id: 65
        kind: function
        ref: composeRecordsUpdate
        arguments:
          - { target: record, type: ComposeRecord, expr: "rcp" }
        meta:
          name: Save recipient
          visual: { id: "65", parent: "1", value: null, xywh: [2200, 0, 0, 0] }
