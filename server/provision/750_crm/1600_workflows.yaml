  # ===========================================================================
  # Setup: re-save every contact so the email intelligence fills in names,
  # email domains and companies on contacts created before it existed
  crm_contacts_enrich_existing:
    meta:
      name: "CRM: Setup - enrich existing contacts"
      description: Re-saves every contact so names, email domain and company are filled from the email address where they are empty.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:namespace
        eventType: onManual
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 80, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: expressions
        arguments:
          - { target: n, type: Integer, value: "0" }
        meta:
          name: Init
          visual: { id: "10", parent: "1", value: null, xywh: [200, 80, 0, 0] }
      - id: 20
        kind: iterator
        ref: composeRecordsEach
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Contact }
        results:
          - { target: c, expr: "record" }
        meta:
          name: Each contact
          visual: { id: "20", parent: "1", value: null, xywh: [400, 80, 0, 0] }
      - id: 30
        kind: function
        ref: composeRecordsUpdate
        arguments:
          - { target: record, type: ComposeRecord, expr: "c" }
        meta:
          name: Re-save (runs email intelligence)
          visual: { id: "30", parent: "1", value: null, xywh: [600, 0, 0, 0] }
      - id: 31
        kind: expressions
        arguments:
          - { target: n, type: Integer, expr: "n + 1" }
        meta:
          name: Count
          visual: { id: "31", parent: "1", value: null, xywh: [800, 0, 0, 0] }
      - id: 32
        kind: continue
        meta:
          name: Next contact
          visual: { id: "32", parent: "1", value: null, xywh: [1000, 0, 0, 0] }
      - id: 40
        kind: prompt
        ref: notification
        arguments:
          - { target: title, type: String, value: Contacts enriched }
          - { target: message, type: String, expr: 'format("Processed %v contacts.", n)' }
          - { target: variant, type: String, value: success }
        meta:
          name: Tell the user
          visual: { id: "40", parent: "1", value: null, xywh: [600, 200, 0, 0] }
    paths:
      - { parentid: 10, childid: 20, meta: { visual: { id: "p10_20", parent: "1", value: null, points: [] } } }
      # iterator: first path is the loop body, second is taken when done
      - { parentid: 20, childid: 30, meta: { name: Loop, visual: { id: "p20_30", parent: "1", value: null, points: [] } } }
      - { parentid: 20, childid: 40, meta: { name: Done, visual: { id: "p20_40", parent: "1", value: null, points: [] } } }
      - { parentid: 30, childid: 31, meta: { visual: { id: "p30_31", parent: "1", value: null, points: [] } } }
      - { parentid: 31, childid: 32, meta: { visual: { id: "p31_32", parent: "1", value: null, points: [] } } }
