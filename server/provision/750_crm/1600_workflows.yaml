  # ===========================================================================
  # New lead: create a follow-up task, wait 3 days, escalate if still open
  crm_lead_followup:
    meta:
      name: "CRM: New lead follow-up"
      description: Creates a follow-up task for new leads, waits 3 days and creates a second task if the first one is still open.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: afterCreate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Contact] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 80, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: gateway
        ref: excl
        meta:
          name: Is a lead?
          visual: { id: "10", parent: "1", value: null, xywh: [200, 80, 0, 0] }
      - id: 20
        kind: function
        ref: composeRecordsNew
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Activity }
        results:
          - { target: task, expr: "record" }
        meta:
          name: New task
          visual: { id: "20", parent: "1", value: null, xywh: [400, 80, 0, 0] }
      - id: 21
        kind: expressions
        arguments:
          - { target: task.values.subject, type: Any, expr: '"Follow up with " + coalesce(record.values.full_name, "new lead")' }
          - { target: task.values.activity_type, type: Any, value: Task }
          - { target: task.values.status, type: Any, value: Planned }
          - { target: task.values.direction, type: Any, value: Outbound }
          - { target: task.values.due_at, type: Any, expr: "modDate(now(), 1)" }
          - { target: task.values.contact, type: Any, expr: "record.ID" }
          - { target: task.values.owner, type: Any, expr: "coalesce(record.values.owner, record.ownedBy)" }
          - { target: task.values.body, type: Any, value: Created automatically by the new-lead follow-up workflow. }
        meta:
          name: Fill in task
          visual: { id: "21", parent: "1", value: null, xywh: [600, 80, 0, 0] }
      - id: 22
        kind: function
        ref: composeRecordsCreate
        arguments:
          - { target: record, type: ComposeRecord, expr: "task" }
        results:
          - { target: task, expr: "record" }
        meta:
          name: Save task
          visual: { id: "22", parent: "1", value: null, xywh: [800, 80, 0, 0] }
      - id: 30
        kind: delay
        arguments:
          - { target: offset, type: Duration, value: "72h" }
        meta:
          name: Wait 3 days
          visual: { id: "30", parent: "1", value: null, xywh: [1000, 80, 0, 0] }
      - id: 40
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Activity }
          - { target: record, type: ID, expr: "task.ID" }
        results:
          - { target: task, expr: "record" }
        meta:
          name: Reload task
          visual: { id: "40", parent: "1", value: null, xywh: [1200, 80, 0, 0] }
      - id: 50
        kind: gateway
        ref: excl
        meta:
          name: Still open?
          visual: { id: "50", parent: "1", value: null, xywh: [1400, 80, 0, 0] }
      - id: 60
        kind: function
        ref: composeRecordsNew
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Activity }
        results:
          - { target: reminder, expr: "record" }
        meta:
          name: New second task
          visual: { id: "60", parent: "1", value: null, xywh: [1600, 0, 0, 0] }
      - id: 61
        kind: expressions
        arguments:
          - { target: reminder.values.subject, type: Any, expr: '"Second follow-up: " + coalesce(record.values.full_name, "lead")' }
          - { target: reminder.values.activity_type, type: Any, value: Task }
          - { target: reminder.values.status, type: Any, value: Planned }
          - { target: reminder.values.direction, type: Any, value: Outbound }
          - { target: reminder.values.due_at, type: Any, expr: "modDate(now(), 1)" }
          - { target: reminder.values.contact, type: Any, expr: "record.ID" }
          - { target: reminder.values.owner, type: Any, expr: "coalesce(task.values.owner, record.ownedBy)" }
        meta:
          name: Fill in second task
          visual: { id: "61", parent: "1", value: null, xywh: [1800, 0, 0, 0] }
      - id: 62
        kind: function
        ref: composeRecordsCreate
        arguments:
          - { target: record, type: ComposeRecord, expr: "reminder" }
        meta:
          name: Save second task
          visual: { id: "62", parent: "1", value: null, xywh: [2000, 0, 0, 0] }
      - id: 63
        kind: expressions
        arguments:
          - { target: runMessage, type: String, value: First follow-up still open after 3 days; second task created. }
        meta:
          name: Escalated
          visual: { id: "63", parent: "1", value: null, xywh: [2200, 0, 0, 0] }
      - id: 65
        kind: expressions
        arguments:
          - { target: runMessage, type: String, value: First follow-up completed within 3 days. }
        meta:
          name: Followed up in time
          visual: { id: "65", parent: "1", value: null, xywh: [1800, 200, 0, 0] }
      - id: 70
        kind: function
        ref: composeRecordsNew
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: AutomationRun }
        results:
          - { target: run, expr: "record" }
        meta:
          name: New run log
          visual: { id: "70", parent: "1", value: null, xywh: [2400, 80, 0, 0] }
      - id: 71
        kind: expressions
        arguments:
          - { target: run.values.workflow, type: Any, value: crm_lead_followup }
          - { target: run.values.workflow_name, type: Any, value: New lead follow-up }
          - { target: run.values.trigger, type: Any, value: Contact created }
          - { target: run.values.status, type: Any, value: Completed }
          - { target: run.values.resource_module, type: Any, value: Contact }
          - { target: run.values.resource_record_id, type: Any, expr: 'format("%v", record.ID)' }
          - { target: run.values.contact, type: Any, expr: "record.ID" }
          - { target: run.values.message, type: Any, expr: "runMessage" }
        meta:
          name: Describe run
          visual: { id: "71", parent: "1", value: null, xywh: [2600, 80, 0, 0] }
      - id: 72
        kind: function
        ref: composeRecordsCreate
        arguments:
          - { target: record, type: ComposeRecord, expr: "run" }
        meta:
          name: Save run log
          visual: { id: "72", parent: "1", value: null, xywh: [2800, 80, 0, 0] }
      - id: 99
        kind: termination
        meta:
          name: Done
          visual: { id: "99", parent: "1", value: null, xywh: [3000, 80, 0, 0] }
    paths:
      - parentid: 10
        childid: 20
        expr: 'record.values.lifecycle_stage == "Lead" || record.values.lifecycle_stage == "MQL" || record.values.lifecycle_stage == "SQL"'
        meta: { name: Lead, visual: { id: "p10_20", parent: "1", value: null, points: [] } }
      - parentid: 10
