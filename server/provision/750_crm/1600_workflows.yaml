# CRM automation flows
#
# These are native Corteza workflows (the node-based automation engine):
#   AutomationFlow -> workflow, AutomationNode -> step, AutomationEdge -> path,
#   AutomationRun  -> workflow session (+ a business-level row in the
#                     AutomationRun module, written by the flows below).
#
# Every step, trigger and path carries meta.visual so the flows open as
# flowcharts in the Workflow editor (Workflows app) where they can be edited.
#
# Conventions
# - Results of record functions are never written into the "record" variable,
#   because in before* triggers whatever "record" holds at the end is what
#   gets saved.
# - Number/ID interpolation uses format() (fmt.Sprintf); "+" on two strings
#   concatenates.

workflows:

  # ===========================================================================
  # Deal: derive probability, weighted amount and closed flags from the stage
  crm_deal_stage_rules:
    meta:
      name: "CRM: Deal stage rules"
      description: Sets probability, weighted amount, closed/won flags and close timestamp from the deal stage.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: beforeCreate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Deal] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 0, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
      - resourceType: compose:record
        eventType: beforeUpdate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Deal] }
        meta:
          visual:
            id: "t2"
            parent: "1"
            xywh: [0, 160, 0, 0]
            edges:
              - { parentID: "t2", childID: "10", meta: { visual: { id: "et2", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: expressions
        arguments:
          - { target: p, type: Integer, expr: 'record.values.stage == "Won" ? 100 : (record.values.stage == "Negotiation" ? 60 : (record.values.stage == "Proposal" ? 40 : (record.values.stage == "Qualified" ? 20 : (record.values.stage == "Lost" ? 0 : 10))))' }
          - { target: record.values.probability, type: Any, expr: "p" }
          - { target: record.values.forecast_amount, type: Any, expr: "float(coalesce(record.values.amount, 0)) * float(p) / 100" }
          - { target: record.values.is_closed, type: Any, expr: 'record.values.stage == "Won" || record.values.stage == "Lost"' }
          - { target: record.values.is_won, type: Any, expr: 'record.values.stage == "Won"' }
        meta:
          name: Probability and weighted amount
          visual: { id: "10", parent: "1", value: null, xywh: [250, 80, 0, 0] }
      - id: 20
        kind: gateway
        ref: excl
        meta:
          name: Just closed?
          visual: { id: "20", parent: "1", value: null, xywh: [500, 80, 0, 0] }
      - id: 30
        kind: expressions
        arguments:
          - { target: record.values.closed_at, type: Any, expr: "now()" }
        meta:
          name: Stamp closed at
          visual: { id: "30", parent: "1", value: null, xywh: [750, 0, 0, 0] }
      - id: 99
        kind: termination
        meta:
          name: Done
          visual: { id: "99", parent: "1", value: null, xywh: [1000, 80, 0, 0] }
    paths:
      - { parentid: 10, childid: 20, meta: { visual: { id: "p10_20", parent: "1", value: null, points: [] } } }
      - parentid: 20
        childid: 30
        expr: '(record.values.stage == "Won" || record.values.stage == "Lost") && isEmpty(record.values.closed_at)'
        meta: { name: Closed now, visual: { id: "p20_30", parent: "1", value: null, points: [] } }
      - parentid: 20
        childid: 99
        expr: ""
        meta: { name: Otherwise, visual: { id: "p20_99", parent: "1", value: null, points: [] } }
      - { parentid: 30, childid: 99, meta: { visual: { id: "p30_99", parent: "1", value: null, points: [] } } }

  # ===========================================================================
  # Contact: display name, default lifecycle stage, unsubscribe timestamp
  crm_contact_defaults:
    meta:
      name: "CRM: Contact defaults"
      description: Builds the contact display name, defaults lifecycle stage to Lead and stamps the unsubscribe time.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: beforeCreate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Contact] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 0, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
      - resourceType: compose:record
        eventType: beforeUpdate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Contact] }
        meta:
          visual:
            id: "t2"
            parent: "1"
            xywh: [0, 160, 0, 0]
            edges:
              - { parentID: "t2", childID: "10", meta: { visual: { id: "et2", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: expressions
        arguments:
          - { target: fullName, type: String, expr: 'trim(coalesce(record.values.first_name, "") + " " + coalesce(record.values.last_name, ""))' }
          - { target: record.values.full_name, type: Any, expr: 'fullName == "" ? coalesce(record.values.email, "") : fullName' }
          - { target: record.values.lifecycle_stage, type: Any, expr: 'coalesce(record.values.lifecycle_stage, "Lead")' }
        meta:
          name: Name and lifecycle defaults
          visual: { id: "10", parent: "1", value: null, xywh: [250, 80, 0, 0] }
      - id: 20
        kind: gateway
        ref: excl
        meta:
          name: Just unsubscribed?
          visual: { id: "20", parent: "1", value: null, xywh: [500, 80, 0, 0] }
      - id: 30
        kind: expressions
        arguments:
          - { target: record.values.unsubscribed_at, type: Any, expr: "now()" }
        meta:
          name: Stamp unsubscribed at
          visual: { id: "30", parent: "1", value: null, xywh: [750, 0, 0, 0] }
      - id: 99
        kind: termination
        meta:
          name: Done
          visual: { id: "99", parent: "1", value: null, xywh: [1000, 80, 0, 0] }
    paths:
      - { parentid: 10, childid: 20, meta: { visual: { id: "p10_20", parent: "1", value: null, points: [] } } }
      - parentid: 20
        childid: 30
        expr: "record.values.email_opt_out == true && isEmpty(record.values.unsubscribed_at)"
        meta: { name: Opted out, visual: { id: "p20_30", parent: "1", value: null, points: [] } }
      - parentid: 20
        childid: 99
        expr: ""
        meta: { name: Otherwise, visual: { id: "p20_99", parent: "1", value: null, points: [] } }
      - { parentid: 30, childid: 99, meta: { visual: { id: "p30_99", parent: "1", value: null, points: [] } } }

  # ===========================================================================
  # Deal won: promote the primary contact and company to Customer
  crm_deal_won:
    meta:
      name: "CRM: Deal won -> customer"
      description: When a deal moves to Won, sets the linked contact and company lifecycle stage to Customer.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: afterUpdate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Deal] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 80, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: gateway
        ref: excl
        meta:
          name: Just won?
          visual: { id: "10", parent: "1", value: null, xywh: [200, 80, 0, 0] }
      - id: 20
        kind: gateway
        ref: excl
        meta:
          name: Has contact?
          visual: { id: "20", parent: "1", value: null, xywh: [400, 80, 0, 0] }
      - id: 30
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Contact }
          - { target: record, type: ID, expr: "record.values.contact" }
        results:
          - { target: contact, expr: "record" }
        meta:
          name: Load contact
          visual: { id: "30", parent: "1", value: null, xywh: [600, 0, 0, 0] }
      - id: 31
        kind: expressions
        arguments:
          - { target: contact.values.lifecycle_stage, type: Any, value: Customer }
        meta:
          name: Contact is a customer
          visual: { id: "31", parent: "1", value: null, xywh: [800, 0, 0, 0] }
      - id: 32
        kind: function
        ref: composeRecordsUpdate
        arguments:
          - { target: record, type: ComposeRecord, expr: "contact" }
        meta:
          name: Save contact
          visual: { id: "32", parent: "1", value: null, xywh: [1000, 0, 0, 0] }
      - id: 50
        kind: gateway
        ref: excl
        meta:
          name: Has company?
          visual: { id: "50", parent: "1", value: null, xywh: [1200, 80, 0, 0] }
      - id: 60
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Company }
          - { target: record, type: ID, expr: "record.values.company" }
        results:
          - { target: company, expr: "record" }
        meta:
          name: Load company
          visual: { id: "60", parent: "1", value: null, xywh: [1400, 0, 0, 0] }
      - id: 61
        kind: expressions
        arguments:
          - { target: company.values.lifecycle_stage, type: Any, value: Customer }
        meta:
          name: Company is a customer
          visual: { id: "61", parent: "1", value: null, xywh: [1600, 0, 0, 0] }
      - id: 62
        kind: function
        ref: composeRecordsUpdate
        arguments:
          - { target: record, type: ComposeRecord, expr: "company" }
        meta:
          name: Save company
          visual: { id: "62", parent: "1", value: null, xywh: [1800, 0, 0, 0] }
      - id: 70
        kind: function
        ref: composeRecordsNew
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: AutomationRun }
        results:
          - { target: run, expr: "record" }
        meta:
          name: New run log
          visual: { id: "70", parent: "1", value: null, xywh: [2000, 80, 0, 0] }
      - id: 71
        kind: expressions
        arguments:
          - { target: run.values.workflow, type: Any, value: crm_deal_won }
          - { target: run.values.workflow_name, type: Any, value: "Deal won -> customer" }
          - { target: run.values.trigger, type: Any, value: Deal updated }
          - { target: run.values.status, type: Any, value: Completed }
          - { target: run.values.resource_module, type: Any, value: Deal }
          - { target: run.values.resource_record_id, type: Any, expr: 'format("%v", record.ID)' }
          - { target: run.values.deal, type: Any, expr: "record.ID" }
          - { target: run.values.message, type: Any, expr: '"Deal won: " + coalesce(record.values.name, "")' }
        meta:
          name: Describe run
          visual: { id: "71", parent: "1", value: null, xywh: [2200, 80, 0, 0] }
      - id: 72
        kind: function
        ref: composeRecordsCreate
        arguments:
          - { target: record, type: ComposeRecord, expr: "run" }
        meta:
          name: Save run log
          visual: { id: "72", parent: "1", value: null, xywh: [2400, 80, 0, 0] }
      - id: 99
        kind: termination
        meta:
          name: Done
          visual: { id: "99", parent: "1", value: null, xywh: [2600, 80, 0, 0] }
    paths:
      - parentid: 10
        childid: 20
        expr: 'record.values.stage == "Won" && oldRecord.values.stage != "Won"'
        meta: { name: Won now, visual: { id: "p10_20", parent: "1", value: null, points: [] } }
      - parentid: 10
        childid: 99
        expr: ""
        meta: { name: Otherwise, visual: { id: "p10_99", parent: "1", value: null, points: [] } }
      - parentid: 20
        childid: 30
        expr: "!isEmpty(record.values.contact)"
        meta: { name: Yes, visual: { id: "p20_30", parent: "1", value: null, points: [] } }
      - parentid: 20
        childid: 50
        expr: ""
        meta: { name: No, visual: { id: "p20_50", parent: "1", value: null, points: [] } }
      - { parentid: 30, childid: 31, meta: { visual: { id: "p30_31", parent: "1", value: null, points: [] } } }
      - { parentid: 31, childid: 32, meta: { visual: { id: "p31_32", parent: "1", value: null, points: [] } } }
      - { parentid: 32, childid: 50, meta: { visual: { id: "p32_50", parent: "1", value: null, points: [] } } }
      - parentid: 50
        childid: 60
        expr: "!isEmpty(record.values.company)"
        meta: { name: Yes, visual: { id: "p50_60", parent: "1", value: null, points: [] } }
      - parentid: 50
        childid: 70
        expr: ""
        meta: { name: No, visual: { id: "p50_70", parent: "1", value: null, points: [] } }
      - { parentid: 60, childid: 61, meta: { visual: { id: "p60_61", parent: "1", value: null, points: [] } } }
      - { parentid: 61, childid: 62, meta: { visual: { id: "p61_62", parent: "1", value: null, points: [] } } }
      - { parentid: 62, childid: 70, meta: { visual: { id: "p62_70", parent: "1", value: null, points: [] } } }
      - { parentid: 70, childid: 71, meta: { visual: { id: "p70_71", parent: "1", value: null, points: [] } } }
      - { parentid: 71, childid: 72, meta: { visual: { id: "p71_72", parent: "1", value: null, points: [] } } }
      - { parentid: 72, childid: 99, meta: { visual: { id: "p72_99", parent: "1", value: null, points: [] } } }

  # ===========================================================================
  # New lead: create a follow-up task, wait 3 days, escalate if still open
  crm_lead_followup:
    meta:
      name: "CRM: New lead follow-up"
      description: Creates a follow-up task for new leads, waits 3 days and creates a second task if the first one is still open.
    enabled: true
    trace: false
    keepsessions: 0
    triggers:
      - resourceType: compose:record
        eventType: afterCreate
        enabled: true
        stepID: 10
        constraints:
          - { name: namespace.handle, op: "=", values: [crm] }
          - { name: module.handle, op: "=", values: [Contact] }
        meta:
          visual:
            id: "t1"
            parent: "1"
            xywh: [0, 80, 0, 0]
            edges:
              - { parentID: "t1", childID: "10", meta: { visual: { id: "et1", parent: "1", value: null, points: [] } } }
    steps:
      - id: 10
        kind: gateway
        ref: excl
        meta:
          name: Is a lead?
          visual: { id: "10", parent: "1", value: null, xywh: [200, 80, 0, 0] }
      - id: 20
        kind: function
        ref: composeRecordsNew
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Activity }
        results:
          - { target: task, expr: "record" }
        meta:
          name: New task
          visual: { id: "20", parent: "1", value: null, xywh: [400, 80, 0, 0] }
      - id: 21
        kind: expressions
        arguments:
          - { target: task.values.subject, type: Any, expr: '"Follow up with " + coalesce(record.values.full_name, "new lead")' }
          - { target: task.values.activity_type, type: Any, value: Task }
          - { target: task.values.status, type: Any, value: Planned }
          - { target: task.values.direction, type: Any, value: Outbound }
          - { target: task.values.due_at, type: Any, expr: "modDate(now(), 1)" }
          - { target: task.values.contact, type: Any, expr: "record.ID" }
          - { target: task.values.owner, type: Any, expr: "coalesce(record.values.owner, record.ownedBy)" }
          - { target: task.values.body, type: Any, value: Created automatically by the new-lead follow-up workflow. }
        meta:
          name: Fill in task
          visual: { id: "21", parent: "1", value: null, xywh: [600, 80, 0, 0] }
      - id: 22
        kind: function
        ref: composeRecordsCreate
        arguments:
          - { target: record, type: ComposeRecord, expr: "task" }
        results:
          - { target: task, expr: "record" }
        meta:
          name: Save task
          visual: { id: "22", parent: "1", value: null, xywh: [800, 80, 0, 0] }
      - id: 30
        kind: delay
        arguments:
          - { target: offset, type: Duration, value: "72h" }
        meta:
          name: Wait 3 days
          visual: { id: "30", parent: "1", value: null, xywh: [1000, 80, 0, 0] }
      - id: 40
        kind: function
        ref: composeRecordsLookup
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Activity }
          - { target: record, type: ID, expr: "task.ID" }
        results:
          - { target: task, expr: "record" }
        meta:
          name: Reload task
          visual: { id: "40", parent: "1", value: null, xywh: [1200, 80, 0, 0] }
      - id: 50
        kind: gateway
        ref: excl
        meta:
          name: Still open?
          visual: { id: "50", parent: "1", value: null, xywh: [1400, 80, 0, 0] }
      - id: 60
        kind: function
        ref: composeRecordsNew
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: Activity }
        results:
          - { target: reminder, expr: "record" }
        meta:
          name: New second task
          visual: { id: "60", parent: "1", value: null, xywh: [1600, 0, 0, 0] }
      - id: 61
        kind: expressions
        arguments:
          - { target: reminder.values.subject, type: Any, expr: '"Second follow-up: " + coalesce(record.values.full_name, "lead")' }
          - { target: reminder.values.activity_type, type: Any, value: Task }
          - { target: reminder.values.status, type: Any, value: Planned }
          - { target: reminder.values.direction, type: Any, value: Outbound }
          - { target: reminder.values.due_at, type: Any, expr: "modDate(now(), 1)" }
          - { target: reminder.values.contact, type: Any, expr: "record.ID" }
          - { target: reminder.values.owner, type: Any, expr: "coalesce(task.values.owner, record.ownedBy)" }
        meta:
          name: Fill in second task
          visual: { id: "61", parent: "1", value: null, xywh: [1800, 0, 0, 0] }
      - id: 62
        kind: function
        ref: composeRecordsCreate
        arguments:
          - { target: record, type: ComposeRecord, expr: "reminder" }
        meta:
          name: Save second task
          visual: { id: "62", parent: "1", value: null, xywh: [2000, 0, 0, 0] }
      - id: 63
        kind: expressions
        arguments:
          - { target: runMessage, type: String, value: First follow-up still open after 3 days; second task created. }
        meta:
          name: Escalated
          visual: { id: "63", parent: "1", value: null, xywh: [2200, 0, 0, 0] }
      - id: 65
        kind: expressions
        arguments:
          - { target: runMessage, type: String, value: First follow-up completed within 3 days. }
        meta:
          name: Followed up in time
          visual: { id: "65", parent: "1", value: null, xywh: [1800, 200, 0, 0] }
      - id: 70
        kind: function
        ref: composeRecordsNew
        arguments:
          - { target: namespace, type: Handle, value: crm }
          - { target: module, type: Handle, value: AutomationRun }
        results:
          - { target: run, expr: "record" }
        meta:
          name: New run log
          visual: { id: "70", parent: "1", value: null, xywh: [2400, 80, 0, 0] }
      - id: 71
        kind: expressions
        arguments:
          - { target: run.values.workflow, type: Any, value: crm_lead_followup }
          - { target: run.values.workflow_name, type: Any, value: New lead follow-up }
          - { target: run.values.trigger, type: Any, value: Contact created }
          - { target: run.values.status, type: Any, value: Completed }
          - { target: run.values.resource_module, type: Any, value: Contact }
          - { target: run.values.resource_record_id, type: Any, expr: 'format("%v", record.ID)' }
          - { target: run.values.contact, type: Any, expr: "record.ID" }
          - { target: run.values.message, type: Any, expr: "runMessage" }
        meta:
          name: Describe run
          visual: { id: "71", parent: "1", value: null, xywh: [2600, 80, 0, 0] }
      - id: 72
        kind: function
        ref: composeRecordsCreate
        arguments:
          - { target: record, type: ComposeRecord, expr: "run" }
        meta:
          name: Save run log
          visual: { id: "72", parent: "1", value: null, xywh: [2800, 80, 0, 0] }
      - id: 99
        kind: termination
        meta:
          name: Done
          visual: { id: "99", parent: "1", value: null, xywh: [3000, 80, 0, 0] }
    paths:
      - parentid: 10
        childid: 20
        expr: 'record.values.lifecycle_stage == "Lead" || record.values.lifecycle_stage == "MQL" || record.values.lifecycle_stage == "SQL"'
        meta: { name: Lead, visual: { id: "p10_20", parent: "1", value: null, points: [] } }
      - parentid: 10
        childid: 99
        expr: ""
        meta: { name: Not a lead, visual: { id: "p10_99", parent: "1", value: null, points: [] } }
      - { parentid: 20, childid: 21, meta: { visual: { id: "p20_21", parent: "1", value: null, points: [] } } }
      - { parentid: 21, childid: 22, meta: { visual: { id: "p21_22", parent: "1", value: null, points: [] } } }
      - { parentid: 22, childid: 30, meta: { visual: { id: "p22_30", parent: "1", value: null, points: [] } } }
      - { parentid: 30, childid: 40, meta: { visual: { id: "p30_40", parent: "1", value: null, points: [] } } }
      - { parentid: 40, childid: 50, meta: { visual: { id: "p40_50", parent: "1", value: null, points: [] } } }
      - parentid: 50
        childid: 60
        expr: 'task.values.status == "Planned"'
        meta: { name: Not done, visual: { id: "p50_60", parent: "1", value: null, points: [] } }
      - parentid: 50
        childid: 65
        expr: ""
        meta: { name: Done, visual: { id: "p50_65", parent: "1", value: null, points: [] } }
      - { parentid: 60, childid: 61, meta: { visual: { id: "p60_61", parent: "1", value: null, points: [] } } }
      - { parentid: 61, childid: 62, meta: { visual: { id: "p61_62", parent: "1", value: null, points: [] } } }
      - { parentid: 62, childid: 63, meta: { visual: { id: "p62_63", parent: "1", value: null, points: [] } } }
      - { parentid: 63, childid: 70, meta: { visual: { id: "p63_70", parent: "1", value: null, points: [] } } }
