# CRM data model
#
# Every module is a Compose module; records live in Corteza's record store
# (values are kept in a JSON column per record), get ULID-style snowflake IDs,
# createdAt/updatedAt/deletedAt timestamps, soft-delete, revisions and RBAC
# for free.
#
# Dynamic/custom properties: every core entity has a "properties" field that
# holds a JSON document for tenant-specific attributes that do not deserve a
# dedicated field yet.
#
# AutomationFlow / AutomationNode / AutomationEdge are NOT modules: they map
# onto native Corteza workflows (workflow, steps, paths). AutomationRun is a
# module so CRM workflows can log business-level run results that charts can
# report on. See README.adoc.

namespace: crm
modules:

  # ---------------------------------------------------------------------------
  Company:
    name: Company
    fields:
      name:
        label: Company name
        kind: String
        required: true
      website:
        label: Website
        kind: Url
        options:
          outputPlain: false
      industry:
        label: Industry
        kind: Select
        options:
          options:
            - { value: Technology, text: Technology }
            - { value: Finance, text: Finance }
            - { value: Healthcare, text: Healthcare }
            - { value: Manufacturing, text: Manufacturing }
            - { value: Retail, text: Retail }
            - { value: Education, text: Education }
            - { value: Professional services, text: Professional services }
            - { value: Real estate, text: Real estate }
            - { value: Non-profit, text: Non-profit }
            - { value: Other, text: Other }
      company_size:
        label: Company size
        kind: Select
        options:
          options:
            - { value: "1-10", text: "1-10" }
            - { value: "11-50", text: "11-50" }
            - { value: "51-200", text: "51-200" }
            - { value: "201-500", text: "201-500" }
            - { value: "501-1000", text: "501-1000" }
            - { value: "1000+", text: "1000+" }
      annual_revenue:
        label: Annual revenue
        kind: Number
        options:
          prefix: "$"
          precision: 0
      phone:
        label: Phone
        kind: String
      city:
        label: City
        kind: String
      country:
        label: Country
        kind: String
      lifecycle_stage:
        label: Lifecycle stage
        kind: Select
        options:
          displayType: badge
          options:
            - { value: Lead, text: Lead }
            - { value: Opportunity, text: Opportunity }
            - { value: Customer, text: Customer }
            - { value: Former customer, text: Former customer }
            - { value: Other, text: Other }
      owner:
        label: Company owner
        kind: User
        options:
          presetWithAuthenticated: true
      tags:
        label: Tags
        kind: String
        multi: true
      description:
        label: Description
        kind: String
        options:
          multiLine: true
      last_activity_at:
        label: Last activity
        kind: DateTime
        options:
          outputRelative: true
      properties:
        label: Custom properties (JSON)
        kind: String
        options:
          multiLine: true

  # ---------------------------------------------------------------------------
  Contact:
    name: Contact
    fields:
      full_name:
        label: Name
        kind: String
      first_name:
        label: First name
        kind: String
      last_name:
        label: Last name
        kind: String
      email:
        label: Email
        kind: Email
        options:
          outputPlain: false
      phone:
        label: Phone
        kind: String
      job_title:
        label: Job title
        kind: String
      company:
        label: Company
        kind: Record
        options:
          module: Company
          labelField: name
          queryFields: [name]
          selectType: default
      lifecycle_stage:
        label: Lifecycle stage
        kind: Select
        options:
          displayType: badge
          options:
            - { value: Subscriber, text: Subscriber }
            - { value: Lead, text: Lead }
            - { value: MQL, text: Marketing qualified lead }
            - { value: SQL, text: Sales qualified lead }
            - { value: Opportunity, text: Opportunity }
            - { value: Customer, text: Customer }
            - { value: Evangelist, text: Evangelist }
            - { value: Other, text: Other }
      status:
        label: Lead status
        kind: Select
        options:
          options:
            - { value: New, text: New }
            - { value: Open, text: Open }
            - { value: In progress, text: In progress }
            - { value: Attempted to contact, text: Attempted to contact }
            - { value: Connected, text: Connected }
            - { value: Unqualified, text: Unqualified }
            - { value: Bad timing, text: Bad timing }
      lead_source:
        label: Lead source
        kind: Select
        options:
          options:
            - { value: Organic search, text: Organic search }
            - { value: Paid search, text: Paid search }
            - { value: Organic social, text: Organic social }
            - { value: Paid social, text: Paid social }
            - { value: Email marketing, text: Email marketing }
            - { value: Referral, text: Referral }
            - { value: Direct traffic, text: Direct traffic }
            - { value: Event, text: Event }
            - { value: Offline, text: Offline }
            - { value: Other, text: Other }
      owner:
        label: Contact owner
        kind: User
        options:
          presetWithAuthenticated: true
      tags:
        label: Tags
        kind: String
        multi: true
      email_opt_out:
        label: Unsubscribed from marketing email
        kind: Bool
        options:
          trueLabel: Unsubscribed
          falseLabel: Subscribed
      unsubscribed_at:
        label: Unsubscribed at
        kind: DateTime
      last_activity_at:
        label: Last activity
        kind: DateTime
        options:
          outputRelative: true
      properties:
        label: Custom properties (JSON)
        kind: String
        options:
          multiLine: true

  # ---------------------------------------------------------------------------
  ContactAddress:
    name: Contact address
    fields:
      contact:
        label: Contact
        kind: Record
        required: true
        options:
          module: Contact
          labelField: full_name
          queryFields: [full_name, email]
      address_type:
        label: Type
        kind: Select
        options:
          options:
            - { value: Work, text: Work }
            - { value: Home, text: Home }
            - { value: Billing, text: Billing }
            - { value: Shipping, text: Shipping }
            - { value: Other, text: Other }
      line1:
        label: Address line 1
        kind: String
      line2:
        label: Address line 2
        kind: String
      city:
        label: City
        kind: String
      state:
        label: State / region
        kind: String
      postal_code:
        label: Postal code
        kind: String
      country:
        label: Country
        kind: String

  # ---------------------------------------------------------------------------
  # Reference data for the pipeline. Deal.stage is a Select (so the kanban board
  # can group by it); keep the names here in sync with Deal.stage options.
  DealStage:
    name: Deal stage
    fields:
      name:
        label: Stage
        kind: String
        required: true
      position:
        label: Position
        kind: Number
        options:
          precision: 0
      probability:
        label: Win probability
        kind: Number
        options:
          suffix: "%"
          precision: 0
      is_closed:
        label: Closed stage
        kind: Bool
      is_won:
        label: Won stage
        kind: Bool
      description:
        label: Description
        kind: String
        options:
          multiLine: true

  # ---------------------------------------------------------------------------
  Deal:
    name: Deal
    fields:
      name:
        label: Deal name
        kind: String
        required: true
      amount:
        label: Amount
        kind: Number
        options:
          prefix: "$"
          precision: 2
      currency:
        label: Currency
        kind: Select
        options:
          options:
            - { value: USD, text: USD }
            - { value: EUR, text: EUR }
            - { value: GBP, text: GBP }
            - { value: CAD, text: CAD }
            - { value: AUD, text: AUD }
      stage:
        label: Deal stage
        kind: Select
        required: true
        defaultValue: New
        options:
          displayType: badge
          options:
            - { value: New, text: New }
            - { value: Qualified, text: Qualified }
            - { value: Proposal, text: Proposal }
            - { value: Negotiation, text: Negotiation }
            - { value: Won, text: Won, style: { backgroundColor: "#28a745", textColor: "#ffffff" } }
            - { value: Lost, text: Lost, style: { backgroundColor: "#dc3545", textColor: "#ffffff" } }
      probability:
        label: Win probability
        kind: Number
        options:
          suffix: "%"
          precision: 0
      forecast_amount:
        label: Weighted amount
        kind: Number
        options:
          prefix: "$"
          precision: 2
      close_date:
        label: Expected close date
        kind: DateTime
        options:
          onlyDate: true
      closed_at:
        label: Closed at
        kind: DateTime
      is_closed:
        label: Closed
        kind: Bool
      is_won:
        label: Won
        kind: Bool
      deal_type:
        label: Deal type
        kind: Select
        options:
          options:
            - { value: New business, text: New business }
            - { value: Existing business, text: Existing business }
            - { value: Renewal, text: Renewal }
      priority:
        label: Priority
        kind: Select
        options:
          options:
            - { value: Low, text: Low }
            - { value: Medium, text: Medium }
            - { value: High, text: High }
      lead_source:
        label: Lead source
        kind: Select
        options:
          options:
            - { value: Organic search, text: Organic search }
            - { value: Paid search, text: Paid search }
            - { value: Organic social, text: Organic social }
            - { value: Paid social, text: Paid social }
            - { value: Email marketing, text: Email marketing }
            - { value: Referral, text: Referral }
            - { value: Direct traffic, text: Direct traffic }
            - { value: Event, text: Event }
            - { value: Offline, text: Offline }
            - { value: Other, text: Other }
      contact:
        label: Primary contact
        kind: Record
        options:
          module: Contact
          labelField: full_name
          queryFields: [full_name, email]
      company:
        label: Company
        kind: Record
        options:
          module: Company
          labelField: name
          queryFields: [name]
      owner:
        label: Deal owner
        kind: User
        options:
          presetWithAuthenticated: true
      lost_reason:
        label: Lost reason
        kind: String
      description:
        label: Description
        kind: String
        options:
          multiLine: true
      properties:
        label: Custom properties (JSON)
        kind: String
        options:
          multiLine: true

  # ---------------------------------------------------------------------------
  # Timeline entries: email, call, meeting, task, note
  Activity:
    name: Activity
    fields:
      subject:
        label: Subject
        kind: String
        required: true
      activity_type:
        label: Type
        kind: Select
        required: true
        defaultValue: Task
        options:
          displayType: badge
          options:
            - { value: Email, text: Email }
            - { value: Call, text: Call }
            - { value: Meeting, text: Meeting }
            - { value: Task, text: Task }
            - { value: Note, text: Note }
      status:
        label: Status
        kind: Select
        defaultValue: Planned
        options:
          options:
            - { value: Planned, text: Planned }
            - { value: Completed, text: Completed }
            - { value: Cancelled, text: Cancelled }
      direction:
        label: Direction
        kind: Select
        options:
          options:
            - { value: Inbound, text: Inbound }
            - { value: Outbound, text: Outbound }
      due_at:
        label: Due
        kind: DateTime
      occurred_at:
        label: Occurred at
        kind: DateTime
      duration_minutes:
        label: Duration (minutes)
        kind: Number
        options:
          precision: 0
      body:
        label: Details
        kind: String
        options:
          multiLine: true
          useRichTextEditor: true
      contact:
        label: Contact
        kind: Record
        options:
          module: Contact
          labelField: full_name
          queryFields: [full_name, email]
      company:
        label: Company
        kind: Record
        options:
          module: Company
          labelField: name
          queryFields: [name]
      deal:
        label: Deal
        kind: Record
        options:
          module: Deal
          labelField: name
          queryFields: [name]
      owner:
        label: Assigned to
        kind: User
        options:
          presetWithAuthenticated: true

  # ---------------------------------------------------------------------------
  Note:
    name: Note
    fields:
      title:
        label: Title
        kind: String
      body:
        label: Note
        kind: String
        required: true
        options:
          multiLine: true
          useRichTextEditor: true
      pinned:
        label: Pinned
        kind: Bool
      contact:
        label: Contact
        kind: Record
        options:
          module: Contact
          labelField: full_name
          queryFields: [full_name, email]
      company:
        label: Company
        kind: Record
        options:
          module: Company
          labelField: name
          queryFields: [name]
      deal:
        label: Deal
        kind: Record
        options:
          module: Deal
          labelField: name
          queryFields: [name]

  # ---------------------------------------------------------------------------
  # Merge tags supported in subject and bodies:
  #   {{first_name}} {{last_name}} {{full_name}} {{email}} {{company}}
  EmailTemplate:
    name: Email template
    fields:
      name:
        label: Template name
        kind: String
        required: true
      category:
        label: Category
        kind: Select
        options:
          options:
            - { value: Newsletter, text: Newsletter }
            - { value: Promotional, text: Promotional }
            - { value: Onboarding, text: Onboarding }
            - { value: Follow-up, text: Follow-up }
            - { value: Transactional, text: Transactional }
      subject:
        label: Subject
        kind: String
        required: true
      preheader:
        label: Preview text
        kind: String
      body_html:
        label: HTML body
        kind: String
        options:
          multiLine: true
          useRichTextEditor: true
          sanitizeXSS: false
      body_text:
        label: Plain-text body
        kind: String
        options:
          multiLine: true
      is_active:
        label: Active
        kind: Bool
        defaultValue: "1"

  # ---------------------------------------------------------------------------
  EmailCampaign:
    name: Email campaign
    fields:
      name:
        label: Campaign name
        kind: String
        required: true
      status:
        label: Status
        kind: Select
        defaultValue: Draft
        options:
          displayType: badge
          options:
            - { value: Draft, text: Draft }
            - { value: Scheduled, text: Scheduled }
            - { value: Sending, text: Sending }
            - { value: Sent, text: Sent }
            - { value: Paused, text: Paused }
            - { value: Cancelled, text: Cancelled }
      template:
        label: Template
        kind: Record
        options:
          module: EmailTemplate
          labelField: name
          queryFields: [name]
      subject:
        label: Subject (overrides template)
        kind: String
      from_name:
        label: From name
        kind: String
      from_email:
        label: From email
        kind: Email
      reply_to:
        label: Reply-to
        kind: Email
      audience_query:
        label: Audience filter (Contact query)
        kind: String
        defaultValue: "lifecycle_stage = 'Lead'"
      scheduled_at:
        label: Scheduled for
        kind: DateTime
      sent_at:
        label: Sent at
        kind: DateTime
      recipients_count:
        label: Recipients
        kind: Number
        options: { precision: 0 }
      sent_count:
        label: Sent
        kind: Number
        options: { precision: 0 }
      opened_count:
        label: Opened
        kind: Number
        options: { precision: 0 }
      clicked_count:
        label: Clicked
        kind: Number
        options: { precision: 0 }
      bounced_count:
        label: Bounced
        kind: Number
        options: { precision: 0 }
      unsubscribed_count:
        label: Unsubscribed
        kind: Number
        options: { precision: 0 }
      owner:
        label: Campaign owner
        kind: User
        options:
          presetWithAuthenticated: true
      description:
        label: Notes
        kind: String
        options:
          multiLine: true

  # ---------------------------------------------------------------------------
  # One row per (campaign, contact). Engagement timestamps are written by the
  # send workflow (queued/sent) and by your ESP webhooks or tracking endpoint
  # through the Compose REST API (opened/clicked/bounced/unsubscribed).
  CampaignRecipient:
    name: Campaign recipient
    fields:
      campaign:
        label: Campaign
        kind: Record
        required: true
        options:
          module: EmailCampaign
          labelField: name
          queryFields: [name]
      contact:
        label: Contact
        kind: Record
        required: true
        options:
          module: Contact
          labelField: full_name
          queryFields: [full_name, email]
      email:
        label: Email
        kind: Email
      status:
        label: Status
        kind: Select
        defaultValue: Queued
        options:
          displayType: badge
          options:
            - { value: Queued, text: Queued }
            - { value: Sent, text: Sent }
            - { value: Opened, text: Opened }
            - { value: Clicked, text: Clicked }
            - { value: Bounced, text: Bounced }
            - { value: Unsubscribed, text: Unsubscribed }
            - { value: Skipped, text: Skipped }
            - { value: Failed, text: Failed }
      queued_at:
        label: Queued at
        kind: DateTime
      sent_at:
        label: Sent at
        kind: DateTime
      opened_at:
        label: First opened at
        kind: DateTime
      clicked_at:
        label: First clicked at
        kind: DateTime
      bounced_at:
        label: Bounced at
        kind: DateTime
      unsubscribed_at:
        label: Unsubscribed at
        kind: DateTime
      open_count:
        label: Opens
        kind: Number
        options: { precision: 0 }
      click_count:
        label: Clicks
        kind: Number
        options: { precision: 0 }
      last_clicked_url:
        label: Last clicked URL
        kind: Url
      error:
        label: Error / skip reason
        kind: String

  # ---------------------------------------------------------------------------
  AutomationRun:
    name: Automation run
    fields:
      workflow:
        label: Workflow handle
        kind: String
        required: true
      workflow_name:
        label: Workflow
        kind: String
      trigger:
        label: Trigger
        kind: String
      status:
        label: Result
        kind: Select
        options:
          displayType: badge
          options:
            - { value: Completed, text: Completed }
            - { value: Skipped, text: Skipped }
            - { value: Failed, text: Failed }
      resource_module:
        label: Module
        kind: String
      resource_record_id:
        label: Record ID
        kind: String
      contact:
        label: Contact
        kind: Record
        options:
          module: Contact
          labelField: full_name
      deal:
        label: Deal
        kind: Record
        options:
          module: Deal
          labelField: name
      campaign:
        label: Campaign
        kind: Record
        options:
          module: EmailCampaign
          labelField: name
      message:
        label: Message
        kind: String
        options:
          multiLine: true
