  # ===========================================================================
  CrmSettings:
    title: Settings
    visible: true
    weight: 10
    blocks:
      - blockid: 1
        title: Setup
        kind: Automation
        xywh: [0, 0, 48, 14]
        options:
          buttons:
            - label: Create default deal stages
              resourceType: compose:namespace
              workflow: crm_setup_default_stages
              stepID: 10
              variant: primary
            - label: Enrich existing contacts from email
              resourceType: compose:namespace
              workflow: crm_contacts_enrich_existing
              stepID: 10
              variant: light
      - blockid: 2
        title: Deal stages
        kind: RecordList
        xywh: [0, 14, 48, 45]
        options:
          module: DealStage
          presort: position ASC
          fields:
            - name: position
            - name: name
            - name: probability
            - name: is_closed
            - name: is_won
      # administrators only: the module is hidden from other users
      - blockid: 3
        title: AI settings (administrators only)
        kind: RecordList
        xywh: [0, 59, 24, 30]
        options:
          module: AiSettings
          perPage: 5
          fields:
            - name: name
            - name: model
            - name: effort
      - blockid: 4
        title: Setting up the AI content generator
        kind: Content
        xywh: [24, 59, 24, 30]
        options:
          body: >-
            <p>The <strong>Generate content with AI</strong> button on a campaign sends the campaign brief to Claude and saves the draft in Generated content.</p>
            <ol>
            <li>Get an API key from <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> (add a payment method and set a monthly spend limit there).</li>
            <li>Click <strong>Create new</strong> in AI settings, paste the key and save. Only one AI settings record is used.</li>
            </ol>
            <p>Each draft costs roughly 5p with Claude Opus 5.5, or about half that with Sonnet 5.5. Always read the draft before you use it.</p>
    page_layouts:
      CrmSettingsDefault:
        primary: true
        meta: { title: Settings }
        config:
          visibility: { expression: "" }
        blocks:
          - { blockID: 1, xywh: [0, 0, 48, 14] }
          - { blockID: 2, xywh: [0, 14, 48, 45] }
          - { blockID: 3, xywh: [0, 59, 24, 30] }
          - { blockID: 4, xywh: [24, 59, 24, 30] }
    pages:

      RecordAiSettings:
        title: AI settings
        module: AiSettings
        visible: false
        blocks:
          - blockid: 1
            title: AI settings
            kind: Record
            xywh: [0, 0, 28, 46]
            options:
              fields:
                - name: name
                - name: anthropic_api_key
                - name: model
                - name: effort
          - blockid: 2
            title: About the key
            kind: Content
            xywh: [28, 0, 20, 46]
            options:
              body: >-
                <p>Paste the key from <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>. It starts with <code>sk-ant-</code>.</p>
                <p>Only administrators can see this record. Set a monthly spend limit in the Anthropic console so costs can't run away.</p>
        page_layouts:
          RecordAiSettingsDefault:
            primary: true
            meta: { title: AI settings }
            config:
              visibility: { expression: "" }
              buttons:
                new: { enabled: true }
                edit: { enabled: true }
                submit: { enabled: true }
                delete: { enabled: true }
                clone: { enabled: false }
                back: { enabled: true }
            blocks:
