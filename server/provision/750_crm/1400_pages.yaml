# CRM pages
#
# Notes on the format:
# - Pages are only rendered through a page layout; each layout lists the
#   blocks it shows (by blockID) and where. Block IDs are page-local.
# - Blocks shown inside a Tabs block are defined on the page but left out of
#   the layout; the Tabs block references them by blockID.
# - The grid is 48 columns wide and every row is 10px tall, so h: 75 is a
#   750px block. Lists need room for their toolbar, search and pagination.
# - Record list prefilters can use ${recordID}, ${userID} and the current
#   record (${record.values.company}); they are JavaScript template strings.
# - Record pages (pages with a "module") are hidden from navigation and are
#   placed under the list page of the same module.

namespace: crm
pages:

  # ===========================================================================
  CrmHome:
    title: Home
    visible: true
    weight: 1
    blocks:
      - blockid: 1
        title: Open pipeline
        kind: Metric
        xywh: [0, 0, 12, 14]
        options:
          metrics:
            - label: Open pipeline
              module: Deal
              metricField: amount
              operation: sum
              filter: "stage != 'Won' AND stage != 'Lost'"
              prefix: "$"
              numberFormat: "0,0"
      - blockid: 2
        title: Weighted forecast
        kind: Metric
        xywh: [12, 0, 12, 14]
        options:
          metrics:
            - label: Weighted forecast
              module: Deal
              metricField: forecast_amount
              operation: sum
              filter: "stage != 'Won' AND stage != 'Lost'"
              prefix: "$"
              numberFormat: "0,0"
      - blockid: 3
        title: Won this year
        kind: Metric
        xywh: [24, 0, 12, 14]
        options:
          metrics:
            - label: Won revenue (this year)
              module: Deal
              metricField: amount
              operation: sum
              filter: "stage = 'Won' AND YEAR(closed_at) = YEAR(NOW())"
              prefix: "$"
              numberFormat: "0,0"
      - blockid: 4
        title: New leads (30 days)
        kind: Metric
        xywh: [36, 0, 12, 14]
        options:
          metrics:
            - label: New leads (30 days)
              module: Contact
              metricField: count
              operation: count
              filter: "lifecycle_stage = 'Lead' AND createdAt >= DATE_SUB(NOW(), INTERVAL 30 DAY)"
      - blockid: 5
        title: My open tasks
        kind: RecordList
        xywh: [0, 14, 24, 45]
        options:
          module: Activity
          prefilter: "owner = ${userID} AND status = 'Planned'"
          presort: due_at ASC
          perPage: 10
          fields:
            - name: subject
            - name: activity_type
            - name: due_at
            - name: contact
            - name: deal
      - blockid: 6
        title: Open pipeline by stage
        kind: Chart
        xywh: [24, 14, 24, 45]
        options:
          chart: CrmOpenPipelineByStage
      - blockid: 7
        title: My deals closing soon
        kind: RecordList
        xywh: [0, 59, 24, 45]
        options:
          module: Deal
          prefilter: "owner = ${userID} AND stage != 'Won' AND stage != 'Lost'"
          presort: close_date ASC
          perPage: 10
          fields:
            - name: name
            - name: stage
            - name: amount
            - name: close_date
            - name: company
      - blockid: 8
        title: Recently added contacts
        kind: RecordList
        xywh: [24, 59, 24, 45]
        options:
          module: Contact
          presort: createdAt DESC
          perPage: 10
          fields:
            - name: full_name
            - name: email
            - name: lifecycle_stage
            - name: lead_source
            - name: owner
    page_layouts:
      CrmHomeDefault:
        primary: true
        meta: { title: Home }
        config:
          visibility: { expression: "" }
        blocks:
          - { blockID: 1, xywh: [0, 0, 12, 14] }
          - { blockID: 2, xywh: [12, 0, 12, 14] }
          - { blockID: 3, xywh: [24, 0, 12, 14] }
          - { blockID: 4, xywh: [36, 0, 12, 14] }
          - { blockID: 5, xywh: [0, 14, 24, 45] }
          - { blockID: 6, xywh: [24, 14, 24, 45] }
          - { blockID: 7, xywh: [0, 59, 24, 45] }
          - { blockID: 8, xywh: [24, 59, 24, 45] }

  # ===========================================================================
  CrmContacts:
    title: Contacts
    visible: true
    weight: 2
    blocks:
      - blockid: 1
        title: Contacts
        kind: RecordList
        xywh: [0, 0, 48, 75]
        options:
          module: Contact
          presort: createdAt DESC
          perPage: 25
          showRecordPerPageOption: true
          showTotalCount: true
          allowExport: true
          selectable: true
          bulkRecordEditEnabled: true
          fields:
            - name: full_name
            - name: email
            - name: phone
            - name: company
            - name: lifecycle_stage
            - name: status
            - name: lead_source
            - name: owner
            - name: last_activity_at
    page_layouts:
      CrmContactsDefault:
        primary: true
        meta: { title: Contacts }
        config:
          visibility: { expression: "" }
        blocks:
          - { blockID: 1, xywh: [0, 0, 48, 75] }
    pages:

      # Contact card, HubSpot style: details on the left, activity in the
      # middle, associations on the right
      RecordContact:
        title: Contact
        module: Contact
        visible: false
        blocks:
          # --- left: who they are ------------------------------------------
          - blockid: 1
            title: Contact
            kind: Record
            xywh: [0, 0, 13, 52]
            options:
              fields:
                - name: full_name
                - name: email
                - name: phone
                - name: job_title
                - name: company
          - blockid: 2
            kind: Automation
            xywh: [0, 52, 13, 14]
            options:
              buttons:
                - label: Note
                  resourceType: compose:record
                  workflow: crm_contact_quick_note
                  stepID: 10
                  variant: light
                - label: Email
                  resourceType: compose:record
                  workflow: crm_contact_quick_email
                  stepID: 10
                  variant: light
                - label: Call
                  resourceType: compose:record
                  workflow: crm_contact_quick_call
                  stepID: 10
                  variant: light
                - label: Task
                  resourceType: compose:record
                  workflow: crm_contact_quick_task
                  stepID: 10
                  variant: light
                - label: Meeting
                  resourceType: compose:record
                  workflow: crm_contact_quick_meeting
                  stepID: 10
                  variant: light
          - blockid: 3
            title: About this contact
            kind: Record
            xywh: [0, 66, 13, 170]
            options:
              fields:
                - name: first_name
                - name: last_name
                - name: email
                - name: phone
                - name: job_title
                - name: company
                - name: lifecycle_stage
                - name: status
                - name: lead_source
                - name: owner
                - name: tags
                - name: email_domain
                - name: city
                - name: country
                - name: email_opt_out
                - name: unsubscribed_at
                - name: last_activity_at
                - name: properties
          # --- middle: activity tabs ---------------------------------------
          - blockid: 4
            kind: Tabs
            xywh: [13, 0, 23, 150]
            options:
              style:
                appearance: tabs
                alignment: left
                justify: none
                orientation: horizontal
                position: start
              tabs:
                - { blockID: "10", title: Activity }
                - { blockID: "11", title: Notes }
                - { blockID: "12", title: Emails }
                - { blockID: "13", title: Calls }
                - { blockID: "14", title: Tasks }
                - { blockID: "15", title: Meetings }
                - { blockID: "16", title: Marketing emails }
          # --- right: associations -----------------------------------------
          - blockid: 5
            title: Company
            kind: RecordList
            xywh: [36, 0, 12, 20]
            options:
              module: Company
              prefilter: "${record.values.company ? 'recordID = ' + record.values.company : 'recordID = 0'}"
              hideAddButton: true
              hideSearch: true
              hidePaging: true
              showTotalCount: false
              selectable: false
              fields:
                - name: name
                - name: domain
          - blockid: 6
            title: Deals
            kind: RecordList
            xywh: [36, 20, 12, 28]
            options:
              module: Deal
              refField: contact
              presort: createdAt DESC
              hideSearch: true
              selectable: false
              perPage: 5
              fields:
                - name: name
                - name: stage
                - name: amount
          - blockid: 7
            title: Lists
            kind: RecordList
            xywh: [36, 48, 12, 22]
            options:
              module: SegmentMember
              refField: contact
              presort: createdAt DESC
              hideSearch: true
              selectable: false
              perPage: 5
              fields:
                - name: segment
                - name: added_at
          - blockid: 8
            title: Addresses
            kind: RecordList
            xywh: [36, 70, 12, 20]
            options:
              module: ContactAddress
              refField: contact
              hideSearch: true
              selectable: false
              perPage: 5
              fields:
                - name: address_type
                - name: city
                - name: country
          - blockid: 9
            title: Deals and engagement
            kind: Record
            xywh: [36, 90, 12, 62]
            options:
              fields:
                - name: open_deals_count
                - name: open_pipeline
                - name: won_revenue
                - name: emails_opened_count
                - name: last_email_opened_at
                - name: last_email_clicked_at
          # --- tab contents (not in the layout) ----------------------------
          - blockid: 10
            title: Activity
            kind: RecordList
            xywh: [0, 0, 24, 60]
            options:
              module: Activity
              refField: contact
              presort: createdAt DESC
              perPage: 10
              fields:
                - name: activity_type
                - name: subject
                - name: status
                - name: due_at
                - name: occurred_at
                - name: owner
          - blockid: 11
            title: Notes
            kind: RecordList
            xywh: [0, 0, 24, 60]
            options:
              module: Note
              refField: contact
              presort: createdAt DESC
              perPage: 10
              fields:
                - name: title
                - name: body
                - name: pinned
          - blockid: 12
            title: Emails
            kind: RecordList
            xywh: [0, 0, 24, 60]
            options:
              module: Activity
              refField: contact
              prefilter: "activity_type = 'Email'"
              presort: createdAt DESC
              perPage: 10
              fields:
                - name: subject
                - name: direction
                - name: occurred_at
                - name: owner
          - blockid: 13
            title: Calls
            kind: RecordList
            xywh: [0, 0, 24, 60]
            options:
              module: Activity
              refField: contact
              prefilter: "activity_type = 'Call'"
              presort: createdAt DESC
              perPage: 10
              fields:
                - name: subject
                - name: status
                - name: due_at
                - name: duration_minutes
                - name: owner
          - blockid: 14
            title: Tasks
            kind: RecordList
            xywh: [0, 0, 24, 60]
            options:
              module: Activity
              refField: contact
              prefilter: "activity_type = 'Task'"
              presort: due_at ASC
              perPage: 10
              fields:
                - name: subject
                - name: status
                - name: due_at
                - name: owner
          - blockid: 15
            title: Meetings
            kind: RecordList
            xywh: [0, 0, 24, 60]
            options:
              module: Activity
              refField: contact
              prefilter: "activity_type = 'Meeting'"
              presort: due_at DESC
              perPage: 10
              fields:
                - name: subject
                - name: status
                - name: due_at
                - name: owner
          - blockid: 16
            title: Marketing emails
            kind: RecordList
            xywh: [0, 0, 24, 60]
            options:
              module: CampaignRecipient
              refField: contact
              presort: createdAt DESC
              hideAddButton: true
              perPage: 10
              fields:
                - name: campaign
                - name: status
                - name: sent_at
                - name: opened_at
                - name: clicked_at
        page_layouts:
          RecordContactDefault:
            primary: true
            meta: { title: Contact }
            config:
              visibility: { expression: "" }
              buttons:
                new: { enabled: true }
                edit: { enabled: true }
                submit: { enabled: true }
                delete: { enabled: true }
                clone: { enabled: true }
                back: { enabled: true }
            blocks:
              - { blockID: 1, xywh: [0, 0, 13, 52] }
              - { blockID: 2, xywh: [0, 52, 13, 14] }
              - { blockID: 3, xywh: [0, 66, 13, 170] }
              - { blockID: 4, xywh: [13, 0, 23, 150] }
              - { blockID: 5, xywh: [36, 0, 12, 20] }
              - { blockID: 6, xywh: [36, 20, 12, 28] }
              - { blockID: 7, xywh: [36, 48, 12, 22] }
              - { blockID: 8, xywh: [36, 70, 12, 20] }
              - { blockID: 9, xywh: [36, 90, 12, 62] }

      RecordContactAddress:
        title: Contact address
        module: ContactAddress
        visible: false
        blocks:
          - blockid: 1
            title: Address
            kind: Record
            xywh: [0, 0, 24, 80]
            options:
              fields:
                - name: contact
                - name: address_type
                - name: line1
                - name: line2
                - name: city
                - name: state
                - name: postal_code
                - name: country
        page_layouts:
          RecordContactAddressDefault:
            primary: true
            meta: { title: Contact address }
            config:
              visibility: { expression: "" }
              buttons:
                new: { enabled: true }
                edit: { enabled: true }
                submit: { enabled: true }
                delete: { enabled: true }
                clone: { enabled: true }
                back: { enabled: true }
            blocks:
              - { blockID: 1, xywh: [0, 0, 24, 80] }

      # -----------------------------------------------------------------------
      # Lists (segments), HubSpot style
      CrmSegments:
        title: Lists
        visible: true
        weight: 1
        blocks:
          - blockid: 1
            title: Lists
            kind: RecordList
            xywh: [0, 14, 48, 70]
            options:
              module: Segment
              presort: name ASC
              perPage: 25
              showRecordPerPageOption: true
              fields:
                - name: name
                - name: list_type
                - name: category
                - name: contact_count
                - name: last_refreshed_at
                - name: owner
          - blockid: 2
            title: How lists work
            kind: Content
            xywh: [0, 0, 48, 14]
            options:
              body: >-
                <p><b>Active</b> lists update automatically: anyone matching the filter is in the list.
                <b>Static</b> lists are a fixed set of contacts: take a snapshot of the filter, or add contacts by hand.
                Pick a list as the audience of an email campaign.</p>
        page_layouts:
          CrmSegmentsDefault:
            primary: true
            meta: { title: Lists }
            config:
              visibility: { expression: "" }
            blocks:
              - { blockID: 2, xywh: [0, 0, 48, 14] }
              - { blockID: 1, xywh: [0, 14, 48, 70] }
        pages:
          RecordSegment:
            title: List
            module: Segment
            visible: false
            blocks:
              - blockid: 1
                title: List
                kind: Record
                xywh: [0, 0, 20, 71]
                options:
                  fields:
                    - name: name
                    - name: list_type
                    - name: category
                    - name: description
                    - name: owner
                    - name: contact_count
                    - name: last_refreshed_at
              - blockid: 6
                title: Who is in this list
                kind: Record
                xywh: [0, 71, 20, 98]
                options:
                  fields:
                    - name: match_lifecycle
                    - name: match_lead_source
                    - name: match_status
                    - name: match_owner
                    - name: match_country
                    - name: match_tag
                    - name: match_engagement
                    - name: match_deals
                    - name: use_advanced_filter
                    - name: filter
              - blockid: 2
                title: Actions
                kind: Automation
                xywh: [20, 0, 28, 14]
                options:
                  buttons:
                    - label: Refresh count
                      resourceType: compose:record
                      workflow: crm_segment_refresh
                      stepID: 10
                      variant: primary
                    - label: Save snapshot (static lists)
                      resourceType: compose:record
                      workflow: crm_segment_snapshot
                      stepID: 10
                      variant: light
              - blockid: 4
                title: Contacts in this list right now
                kind: RecordList
                xywh: [20, 14, 28, 90]
                options:
                  module: Contact
                  prefilter: "${record.values.filter || ''}"
                  presort: createdAt DESC
                  perPage: 25
                  showRecordPerPageOption: true
                  showTotalCount: true
                  hideAddButton: true
                  fields:
                    - name: full_name
                    - name: email
                    - name: company
                    - name: lifecycle_stage
                    - name: owner
              - blockid: 3
                title: How to choose who is in the list
                kind: Content
                xywh: [20, 104, 28, 65]
                options:
                  body: >-
                    <p>Pick the options under <b>Who is in this list</b> and click <b>Save</b>.
                    Empty options mean "any", so a list with nothing chosen contains <b>every contact</b>.
                    Choosing several values in one option means "any of these"; different options must all match.</p>
                    <p><b>Active</b> lists update by themselves. <b>Static</b> lists keep a fixed set of people:
                    click <b>Save snapshot</b> to add everyone who matches now, or add people by hand below.</p>
                    <p><b>Advanced:</b> tick <i>Write the filter myself</i> to type your own filter, for example
                    <code>job_title LIKE '%Director%' AND lifecycle_stage = 'Lead'</code>,
                    <code>won_revenue &gt;= 10000</code> or
                    <code>last_activity_at &lt; DATE_SUB(NOW(), INTERVAL 90 DAY)</code>.
                    Text goes in single quotes; combine with <code>AND</code>, <code>OR</code> and brackets.</p>
              - blockid: 5
                title: Saved members (static lists)
                kind: RecordList
                xywh: [0, 169, 48, 50]
                options:
                  module: SegmentMember
                  refField: segment
                  presort: createdAt DESC
                  perPage: 25
                  showRecordPerPageOption: true
                  fields:
                    - name: contact
                    - name: source
                    - name: added_at
            page_layouts:
              RecordSegmentDefault:
                primary: true
                meta: { title: List }
                config:
                  visibility: { expression: "" }
                  buttons:
                    new: { enabled: true }
                    edit: { enabled: true }
                    submit: { enabled: true }
                    delete: { enabled: true }
                    clone: { enabled: true }
                    back: { enabled: true }
                blocks:
                  - { blockID: 1, xywh: [0, 0, 20, 71] }
                  - { blockID: 6, xywh: [0, 71, 20, 98] }
                  - { blockID: 2, xywh: [20, 0, 28, 14] }
                  - { blockID: 4, xywh: [20, 14, 28, 90] }
                  - { blockID: 3, xywh: [20, 104, 28, 65] }
                  - { blockID: 5, xywh: [0, 169, 48, 50] }

          RecordSegmentMember:
            title: List member
            module: SegmentMember
            visible: false
            blocks:
              - blockid: 1
                title: List member
                kind: Record
                xywh: [0, 0, 24, 44]
                options:
                  fields:
                    - name: segment
                    - name: contact
                    - name: source
                    - name: added_at
            page_layouts:
              RecordSegmentMemberDefault:
                primary: true
                meta: { title: List member }
                config:
                  visibility: { expression: "" }
                  buttons:
                    new: { enabled: true }
                    edit: { enabled: true }
                    submit: { enabled: true }
                    delete: { enabled: true }
                    clone: { enabled: true }
                    back: { enabled: true }
                blocks:
                  - { blockID: 1, xywh: [0, 0, 24, 44] }

  # ===========================================================================
  CrmCompanies:
    title: Companies
    visible: true
    weight: 3
    blocks:
      - blockid: 1
        title: Companies
        kind: RecordList
        xywh: [0, 0, 48, 75]
        options:
          module: Company
          presort: name ASC
          perPage: 25
          showRecordPerPageOption: true
          showTotalCount: true
          allowExport: true
          fields:
            - name: name
            - name: domain
            - name: industry
            - name: company_size
            - name: city
            - name: country
            - name: lifecycle_stage
            - name: owner
    page_layouts:
      CrmCompaniesDefault:
        primary: true
        meta: { title: Companies }
        config:
          visibility: { expression: "" }
        blocks:
          - { blockID: 1, xywh: [0, 0, 48, 75] }
    pages:

      RecordCompany:
        title: Company
        module: Company
        visible: false
        blocks:
          - blockid: 1
            title: About this company
            kind: Record
            xywh: [0, 0, 13, 145]
            options:
              fields:
                - name: name
                - name: website
                - name: domain
                - name: industry
                - name: company_size
                - name: annual_revenue
                - name: phone
                - name: city
                - name: country
                - name: lifecycle_stage
                - name: owner
                - name: tags
                - name: description
                - name: last_activity_at
                - name: properties
          - blockid: 2
            kind: Tabs
            xywh: [13, 0, 23, 145]
            options:
              style:
                appearance: tabs
                alignment: left
                justify: none
                orientation: horizontal
                position: start
              tabs:
                - { blockID: "10", title: Activity }
                - { blockID: "11", title: Notes }
          - blockid: 3
            title: Contacts
            kind: RecordList
            xywh: [36, 0, 12, 72]
            options:
              module: Contact
              refField: company
              presort: full_name ASC
              hideSearch: true
              selectable: false
              perPage: 10
              fields:
                - name: full_name
                - name: job_title
          - blockid: 4
            title: Deals
            kind: RecordList
            xywh: [36, 72, 12, 73]
            options:
              module: Deal
              refField: company
              presort: createdAt DESC
              hideSearch: true
              selectable: false
              perPage: 10
              fields:
                - name: name
                - name: stage
                - name: amount
          - blockid: 10
            title: Activity
            kind: RecordList
            xywh: [0, 0, 24, 60]
            options:
              module: Activity
              refField: company
              presort: createdAt DESC
              perPage: 10
              fields:
                - name: activity_type
                - name: subject
                - name: status
                - name: contact
                - name: occurred_at
          - blockid: 11
            title: Notes
            kind: RecordList
            xywh: [0, 0, 24, 60]
            options:
              module: Note
              refField: company
              presort: createdAt DESC
              perPage: 10
              fields:
                - name: title
                - name: body
                - name: pinned
        page_layouts:
          RecordCompanyDefault:
            primary: true
            meta: { title: Company }
            config:
              visibility: { expression: "" }
              buttons:
                new: { enabled: true }
                edit: { enabled: true }
                submit: { enabled: true }
                delete: { enabled: true }
                clone: { enabled: true }
                back: { enabled: true }
            blocks:
              - { blockID: 1, xywh: [0, 0, 13, 145] }
              - { blockID: 2, xywh: [13, 0, 23, 145] }
              - { blockID: 3, xywh: [36, 0, 12, 72] }
              - { blockID: 4, xywh: [36, 72, 12, 73] }

  # ===========================================================================
  # Kanban board: one RecordOrganizer column per stage, grouped by Deal.stage.
  # Dragging a card between columns sets Deal.stage, which triggers the
  # stage-rules workflow (probability, weighted amount, close flags).
  CrmPipeline:
    title: Pipeline
    visible: true
    weight: 4
    blocks:
      - blockid: 1
        title: Open pipeline
        kind: Metric
        xywh: [0, 0, 16, 14]
        options:
          metrics:
            - label: Open pipeline
              module: Deal
              metricField: amount
              operation: sum
              filter: "stage != 'Won' AND stage != 'Lost'"
              prefix: "$"
              numberFormat: "0,0"
      - blockid: 2
        title: Weighted forecast
        kind: Metric
        xywh: [16, 0, 16, 14]
        options:
          metrics:
            - label: Weighted forecast
              module: Deal
              metricField: forecast_amount
              operation: sum
              filter: "stage != 'Won' AND stage != 'Lost'"
              prefix: "$"
              numberFormat: "0,0"
      - blockid: 3
        title: Open deals
        kind: Metric
        xywh: [32, 0, 16, 14]
        options:
          metrics:
            - label: Open deals
              module: Deal
              metricField: count
              operation: count
              filter: "stage != 'Won' AND stage != 'Lost'"
      - blockid: 4
        title: New
        kind: RecordOrganizer
        xywh: [0, 14, 8, 80]
        options:
          module: Deal
          labelField: name
