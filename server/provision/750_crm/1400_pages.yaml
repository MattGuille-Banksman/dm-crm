              prefilter: "company = ${recordID}"
              fields:
                - name: full_name
                - name: email
                - name: job_title
                - name: lifecycle_stage
          - blockid: 3
            title: Deals
            kind: RecordList
            xywh: [16, 12, 32, 12]
            options:
              module: Deal
              prefilter: "company = ${recordID}"
              fields:
