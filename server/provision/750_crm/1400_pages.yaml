  # ===========================================================================
  # Campaigns: a brief plus the emails (and later other assets) that belong
  # to it
  CrmCampaigns:
    title: Campaigns
    visible: true
    weight: 8
    blocks:
      - blockid: 1
        title: Campaigns
        kind: RecordList
        xywh: [0, 0, 48, 75]
        options:
          module: Campaign
          presort: createdAt DESC
          perPage: 25
          showRecordPerPageOption: true
          showTotalCount: true
          fields:
            - name: name
            - name: status
            - name: owner
            - name: start_date
            - name: end_date
            - name: channels
            - name: audience
    page_layouts:
      CrmCampaignsDefault:
        primary: true
        meta: { title: Campaigns }
        config:
          visibility: { expression: "" }
        blocks:
          - { blockID: 1, xywh: [0, 0, 48, 75] }
    pages:

      RecordCampaign:
        title: Campaign
        module: Campaign
        visible: false
        blocks:
          - blockid: 1
            title: Campaign brief
            kind: Record
            xywh: [0, 0, 22, 160]
            options:
              recordSelectorShowAddRecordButton: true
              recordSelectorAddRecordDisplayOption: modal
              fields:
                - name: name
                - name: status
                - name: owner
                - name: start_date
                - name: end_date
                - name: budget
                - name: audience
                - name: channels
                - name: about
                - name: key_message_1
                - name: key_message_2
                - name: key_message_3
                - name: keywords
                - name: call_to_action
                - name: writing_style
                - name: notes
          - blockid: 2
            title: Actions
            kind: Automation
            xywh: [22, 0, 26, 14]
            options:
              buttons:
                - label: Create email in this campaign
                  resourceType: compose:record
                  workflow: crm_campaign_new_email
                  stepID: 10
                  variant: primary
                - label: Generate content with AI
                  resourceType: compose:record
                  workflow: crm_campaign_generate_content
                  stepID: 10
                  variant: outline-primary
          - blockid: 6
            title: Emails
            kind: Metric
            xywh: [22, 14, 9, 16]
            options:
              metrics:
                - label: Emails
                  module: EmailCampaign
                  metricField: count
                  operation: count
                  filter: "campaign = ${recordID}"
          - blockid: 7
            title: Sent
            kind: Metric
            xywh: [31, 14, 9, 16]
            options:
              metrics:
                - label: Sent
                  module: EmailCampaign
                  metricField: sent_count
                  operation: sum
                  filter: "campaign = ${recordID}"
          - blockid: 8
            title: Opened
            kind: Metric
            xywh: [40, 14, 8, 16]
            options:
              metrics:
                - label: Opened
                  module: EmailCampaign
                  metricField: opened_count
                  operation: sum
                  filter: "campaign = ${recordID}"
          - blockid: 3
            title: Emails in this campaign
            kind: RecordList
            xywh: [22, 30, 26, 60]
            options:
              module: EmailCampaign
              refField: campaign
              presort: createdAt DESC
              perPage: 10
              hideAddButton: true
              fields:
                - name: name
                - name: status
                - name: sent_at
                - name: recipients_count
                - name: opened_count
                - name: clicked_count
          - blockid: 5
            title: Generated content
            kind: Record
            xywh: [22, 90, 26, 70]
            options:
              fields:
                - name: generated_content
        page_layouts:
          RecordCampaignDefault:
            primary: true
            meta: { title: Campaign }
            config:
              visibility: { expression: "" }
              buttons:
                new: { enabled: true }
                edit: { enabled: true }
                submit: { enabled: true }
                delete: { enabled: true }
                clone: { enabled: true }
                back: { enabled: true }
            blocks:
              - { blockID: 1, xywh: [0, 0, 22, 160] }
              - { blockID: 2, xywh: [22, 0, 26, 14] }
              - { blockID: 6, xywh: [22, 14, 9, 16] }
              - { blockID: 7, xywh: [31, 14, 9, 16] }
              - { blockID: 8, xywh: [40, 14, 8, 16] }
              - { blockID: 3, xywh: [22, 30, 26, 60] }
              - { blockID: 5, xywh: [22, 90, 26, 70] }

