                - name: name
                - name: website
                - name: industry
                - name: company_size
                - name: annual_revenue
                - name: phone
                - name: city
                - name: country
                - name: lifecycle_stage
                - name: owner
                - name: tags
                - name: description
                - name: last_activity_at
                - name: properties
          - blockid: 2
            title: Contacts
            kind: RecordList
            xywh: [16, 0, 32, 12]
            options:
