        kind: RecordList
        xywh: [0, 18, 48, 24]
        options:
          module: Activity
          presort: createdAt DESC
          perPage: 25
          fields:
            - name: activity_type
            - name: subject
            - name: status
            - name: occurred_at
            - name: contact
            - name: company
            - name: deal
            - name: owner
    page_layouts:
      CrmActivitiesDefault:
        primary: true
        meta: { title: Activities }
        config:
          visibility: { expression: "" }
        blocks:
          - { blockID: 1, xywh: [0, 0, 48, 18] }
          - { blockID: 2, xywh: [0, 18, 48, 24] }
    pages:

      RecordActivity:
        title: Activity
        module: Activity
        visible: false
        blocks:
          - blockid: 1
            title: Activity
            kind: Record
            xywh: [0, 0, 32, 36]
            options:
              fields:
                - name: activity_type
                - name: subject
                - name: status
                - name: direction
                - name: due_at
                - name: occurred_at
                - name: duration_minutes
                - name: contact
                - name: company
                - name: deal
                - name: owner
                - name: body
        page_layouts:
          RecordActivityDefault:
            primary: true
            meta: { title: Activity }
            config:
              visibility: { expression: "" }
              buttons:
                new: { enabled: true }
                edit: { enabled: true }
                submit: { enabled: true }
                delete: { enabled: true }
                clone: { enabled: true }
                back: { enabled: true }
            blocks:
              - { blockID: 1, xywh: [0, 0, 32, 36] }

      RecordNote:
        title: Note
        module: Note
        visible: false
        blocks:
          - blockid: 1
            title: Note
            kind: Record
            xywh: [0, 0, 32, 30]
            options:
              fields:
                - name: title
                - name: body
                - name: pinned
                - name: contact
                - name: company
                - name: deal
        page_layouts:
          RecordNoteDefault:
            primary: true
            meta: { title: Note }
            config:
              visibility: { expression: "" }
              buttons:
                new: { enabled: true }
                edit: { enabled: true }
                submit: { enabled: true }
                delete: { enabled: true }
                clone: { enabled: true }
                back: { enabled: true }
            blocks:
              - { blockID: 1, xywh: [0, 0, 32, 30] }

  # ===========================================================================
  CrmMarketing:
    title: Email campaigns
    visible: true
    weight: 7
    blocks:
      - blockid: 1
        title: Campaigns
        kind: RecordList
        xywh: [0, 0, 48, 24]
        options:
          module: EmailCampaign
          presort: createdAt DESC
          fields:
            - name: name
            - name: status
            - name: template
            - name: scheduled_at
            - name: sent_at
            - name: recipients_count
            - name: sent_count
            - name: opened_count
            - name: clicked_count
            - name: owner
    page_layouts:
      CrmMarketingDefault:
        primary: true
        meta: { title: Email campaigns }
        config:
          visibility: { expression: "" }
        blocks:
          - { blockID: 1, xywh: [0, 0, 48, 24] }
    pages:

      RecordEmailCampaign:
        title: Email campaign
        module: EmailCampaign
        visible: false
        blocks:
          - blockid: 1
            title: Campaign
            kind: Record
            xywh: [0, 0, 20, 40]
            options:
              fields:
                - name: name
                - name: status
                - name: template
                - name: subject
                - name: from_name
                - name: from_email
                - name: reply_to
                - name: audience_query
                - name: scheduled_at
                - name: sent_at
                - name: owner
                - name: description
          - blockid: 2
            title: Actions
            kind: Automation
            xywh: [20, 0, 28, 6]
            options:
              buttons:
                - label: 1. Build recipient list
                  resourceType: compose:record
                  workflow: crm_campaign_build_recipients
                  stepID: 10
                  variant: primary
                - label: 2. Send campaign
                  resourceType: compose:record
                  workflow: crm_campaign_send
                  stepID: 10
                  variant: success
                - label: Refresh stats
                  resourceType: compose:record
                  workflow: crm_campaign_refresh_stats
                  stepID: 10
                  variant: light
          - blockid: 3
            title: Engagement
            kind: Metric
            xywh: [20, 6, 28, 6]
            options:
              metrics:
                - label: Recipients
                  module: CampaignRecipient
                  metricField: count
                  operation: count
                  filter: "campaign = ${recordID}"
                - label: Opened or clicked
                  module: CampaignRecipient
                  metricField: count
                  operation: count
                  filter: "campaign = ${recordID} AND (status = 'Opened' OR status = 'Clicked')"
                - label: Unsubscribed
                  module: CampaignRecipient
                  metricField: count
                  operation: count
                  filter: "campaign = ${recordID} AND status = 'Unsubscribed'"
          - blockid: 4
            title: Recipients
            kind: RecordList
            xywh: [20, 12, 28, 28]
            options:
              module: CampaignRecipient
              prefilter: "campaign = ${recordID}"
              presort: createdAt ASC
              perPage: 25
              hideAddButton: true
              fields:
                - name: contact
                - name: email
                - name: status
                - name: sent_at
                - name: opened_at
                - name: clicked_at
                - name: error
        page_layouts:
          RecordEmailCampaignDefault:
            primary: true
            meta: { title: Email campaign }
            config:
              visibility: { expression: "" }
              buttons:
                new: { enabled: true }
                edit: { enabled: true }
                submit: { enabled: true }
                delete: { enabled: true }
                clone: { enabled: true }
