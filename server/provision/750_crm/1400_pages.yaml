# CRM pages
#
# Notes on the format:
# - Pages are only rendered through a page layout; each layout lists the
#   blocks it shows (by blockID) and where. Block IDs are page-local and
#   numbered from 1 in the order the blocks are defined.
# - The grid is 48 columns wide.
# - Record list prefilters can use ${recordID} (current record on a record
#   page) and ${userID} (current user).
# - Record pages (pages with a "module") are hidden from navigation and are
#   placed under the list page of the same module.

namespace: crm
pages:

  # ===========================================================================
  CrmHome:
    title: Home
    visible: true
    weight: 1
    blocks:
      - blockid: 1
        title: Open pipeline
        kind: Metric
        xywh: [0, 0, 12, 6]
        options:
          metrics:
            - label: Open pipeline
              module: Deal
              metricField: amount
              operation: sum
              filter: "stage != 'Won' AND stage != 'Lost'"
              prefix: "$"
              numberFormat: "0,0"
      - blockid: 2
        title: Weighted forecast
        kind: Metric
        xywh: [12, 0, 12, 6]
        options:
          metrics:
            - label: Weighted forecast
              module: Deal
              metricField: forecast_amount
              operation: sum
              filter: "stage != 'Won' AND stage != 'Lost'"
              prefix: "$"
              numberFormat: "0,0"
      - blockid: 3
        title: Won this year
        kind: Metric
        xywh: [24, 0, 12, 6]
        options:
          metrics:
            - label: Won revenue (this year)
              module: Deal
              metricField: amount
              operation: sum
              filter: "stage = 'Won' AND YEAR(closed_at) = YEAR(NOW())"
              prefix: "$"
              numberFormat: "0,0"
      - blockid: 4
        title: New leads (30 days)
        kind: Metric
        xywh: [36, 0, 12, 6]
        options:
          metrics:
            - label: New leads (30 days)
              module: Contact
              metricField: count
              operation: count
              filter: "lifecycle_stage = 'Lead' AND createdAt >= DATE_SUB(NOW(), INTERVAL 30 DAY)"
      - blockid: 5
        title: My open tasks
        kind: RecordList
        xywh: [0, 6, 24, 16]
        options:
          module: Activity
          prefilter: "owner = ${userID} AND status = 'Planned'"
          presort: due_at ASC
          perPage: 10
          fields:
            - name: subject
            - name: activity_type
            - name: due_at
            - name: contact
            - name: deal
      - blockid: 6
        title: Open pipeline by stage
        kind: Chart
        xywh: [24, 6, 24, 16]
        options:
          chart: CrmOpenPipelineByStage
      - blockid: 7
        title: My deals closing soon
        kind: RecordList
        xywh: [0, 22, 24, 16]
        options:
          module: Deal
          prefilter: "owner = ${userID} AND stage != 'Won' AND stage != 'Lost'"
          presort: close_date ASC
          perPage: 10
          fields:
            - name: name
            - name: stage
            - name: amount
            - name: close_date
            - name: company
      - blockid: 8
        title: Recently added contacts
        kind: RecordList
        xywh: [24, 22, 24, 16]
        options:
          module: Contact
          presort: createdAt DESC
          perPage: 10
          fields:
            - name: full_name
            - name: email
            - name: lifecycle_stage
            - name: lead_source
            - name: owner
    page_layouts:
      CrmHomeDefault:
        primary: true
        meta: { title: Home }
        config:
          visibility: { expression: "" }
        blocks:
          - { blockID: 1, xywh: [0, 0, 12, 6] }
          - { blockID: 2, xywh: [12, 0, 12, 6] }
          - { blockID: 3, xywh: [24, 0, 12, 6] }
          - { blockID: 4, xywh: [36, 0, 12, 6] }
          - { blockID: 5, xywh: [0, 6, 24, 16] }
          - { blockID: 6, xywh: [24, 6, 24, 16] }
          - { blockID: 7, xywh: [0, 22, 24, 16] }
          - { blockID: 8, xywh: [24, 22, 24, 16] }

  # ===========================================================================
  CrmContacts:
    title: Contacts
    visible: true
    weight: 2
    blocks:
      - blockid: 1
        title: Contacts
        kind: RecordList
        xywh: [0, 0, 48, 30]
        options:
          module: Contact
          presort: createdAt DESC
          perPage: 25
          allowExport: true
          selectable: true
          bulkRecordEditEnabled: true
          fields:
            - name: full_name
            - name: email
            - name: phone
            - name: company
            - name: lifecycle_stage
            - name: status
            - name: lead_source
            - name: owner
            - name: last_activity_at
    page_layouts:
      CrmContactsDefault:
        primary: true
        meta: { title: Contacts }
        config:
          visibility: { expression: "" }
        blocks:
          - { blockID: 1, xywh: [0, 0, 48, 30] }
    pages:

      RecordContact:
        title: Contact
        module: Contact
        visible: false
        blocks:
          - blockid: 1
            title: About this contact
            kind: Record
            xywh: [0, 0, 16, 40]
            options:
              fields:
                - name: first_name
                - name: last_name
                - name: email
                - name: phone
                - name: job_title
                - name: company
                - name: lifecycle_stage
                - name: status
                - name: lead_source
                - name: owner
                - name: tags
                - name: email_opt_out
                - name: unsubscribed_at
                - name: last_activity_at
                - name: properties
          - blockid: 2
            title: Activity timeline
            kind: RecordList
            xywh: [16, 0, 32, 20]
            options:
              module: Activity
              prefilter: "contact = ${recordID}"
              presort: createdAt DESC
              perPage: 10
              fields:
                - name: activity_type
                - name: subject
                - name: status
                - name: due_at
                - name: occurred_at
                - name: owner
          - blockid: 3
            title: Notes
            kind: RecordList
            xywh: [16, 20, 32, 20]
            options:
              module: Note
              prefilter: "contact = ${recordID}"
              presort: createdAt DESC
              perPage: 10
              fields:
                - name: title
                - name: body
                - name: pinned
          - blockid: 4
            title: Deals
            kind: RecordList
            xywh: [0, 40, 24, 14]
            options:
              module: Deal
              prefilter: "contact = ${recordID}"
              presort: createdAt DESC
              fields:
                - name: name
                - name: stage
                - name: amount
                - name: close_date
          - blockid: 5
            title: Addresses
            kind: RecordList
            xywh: [24, 40, 24, 14]
            options:
              module: ContactAddress
              prefilter: "contact = ${recordID}"
              fields:
                - name: address_type
                - name: line1
                - name: city
                - name: country
          - blockid: 6
            title: Email history
            kind: RecordList
            xywh: [0, 54, 48, 14]
            options:
              module: CampaignRecipient
              prefilter: "contact = ${recordID}"
              presort: createdAt DESC
              hideAddButton: true
              fields:
                - name: campaign
                - name: status
                - name: sent_at
                - name: opened_at
                - name: clicked_at
        page_layouts:
          RecordContactDefault:
            primary: true
            meta: { title: Contact }
            config:
              visibility: { expression: "" }
              buttons:
                new: { enabled: true }
                edit: { enabled: true }
                submit: { enabled: true }
                delete: { enabled: true }
                clone: { enabled: true }
                back: { enabled: true }
            blocks:
              - { blockID: 1, xywh: [0, 0, 16, 40] }
              - { blockID: 2, xywh: [16, 0, 32, 20] }
              - { blockID: 3, xywh: [16, 20, 32, 20] }
              - { blockID: 4, xywh: [0, 40, 24, 14] }
              - { blockID: 5, xywh: [24, 40, 24, 14] }
              - { blockID: 6, xywh: [0, 54, 48, 14] }

      RecordContactAddress:
        title: Contact address
        module: ContactAddress
        visible: false
        blocks:
          - blockid: 1
            title: Address
            kind: Record
            xywh: [0, 0, 24, 24]
            options:
              fields:
                - name: contact
                - name: address_type
                - name: line1
                - name: line2
                - name: city
                - name: state
                - name: postal_code
                - name: country
        page_layouts:
          RecordContactAddressDefault:
            primary: true
            meta: { title: Contact address }
            config:
              visibility: { expression: "" }
              buttons:
                new: { enabled: true }
                edit: { enabled: true }
                submit: { enabled: true }
                delete: { enabled: true }
                clone: { enabled: true }
                back: { enabled: true }
            blocks:
              - { blockID: 1, xywh: [0, 0, 24, 24] }

  # ===========================================================================
  CrmCompanies:
