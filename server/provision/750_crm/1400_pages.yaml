                - name: title
                - name: body
                - name: pinned
        page_layouts:
          RecordCompanyDefault:
            primary: true
            meta: { title: Company }
            config:
              visibility: { expression: "" }
              buttons:
                new: { enabled: true }
                edit: { enabled: true }
                submit: { enabled: true }
                delete: { enabled: true }
                clone: { enabled: true }
                back: { enabled: true }
            blocks:
              - { blockID: 1, xywh: [0, 0, 16, 36] }
              - { blockID: 2, xywh: [16, 0, 32, 12] }
              - { blockID: 3, xywh: [16, 12, 32, 12] }
              - { blockID: 4, xywh: [16, 24, 32, 12] }
              - { blockID: 5, xywh: [0, 36, 48, 12] }

  # ===========================================================================
  # Kanban board: one RecordOrganizer column per stage, grouped by Deal.stage.
  # Dragging a card between columns sets Deal.stage, which triggers the
  # stage-rules workflow (probability, weighted amount, close flags).
  CrmPipeline:
    title: Pipeline
    visible: true
    weight: 4
    blocks:
      - blockid: 1
        title: Open pipeline
        kind: Metric
        xywh: [0, 0, 16, 5]
        options:
          metrics:
            - label: Open pipeline
              module: Deal
              metricField: amount
              operation: sum
              filter: "stage != 'Won' AND stage != 'Lost'"
              prefix: "$"
              numberFormat: "0,0"
      - blockid: 2
        title: Weighted forecast
        kind: Metric
        xywh: [16, 0, 16, 5]
        options:
          metrics:
            - label: Weighted forecast
              module: Deal
              metricField: forecast_amount
              operation: sum
              filter: "stage != 'Won' AND stage != 'Lost'"
              prefix: "$"
              numberFormat: "0,0"
      - blockid: 3
        title: Open deals
        kind: Metric
        xywh: [32, 0, 16, 5]
        options:
          metrics:
            - label: Open deals
              module: Deal
              metricField: count
              operation: count
              filter: "stage != 'Won' AND stage != 'Lost'"
      - blockid: 4
        title: New
        kind: RecordOrganizer
        xywh: [0, 5, 8, 40]
        options:
          module: Deal
          labelField: name
          descriptionField: amount
          groupField: stage
          group: New
          filter: "stage = 'New'"
      - blockid: 5
        title: Qualified
        kind: RecordOrganizer
        xywh: [8, 5, 8, 40]
        options:
          module: Deal
          labelField: name
          descriptionField: amount
          groupField: stage
          group: Qualified
          filter: "stage = 'Qualified'"
      - blockid: 6
        title: Proposal
        kind: RecordOrganizer
        xywh: [16, 5, 8, 40]
        options:
          module: Deal
          labelField: name
          descriptionField: amount
          groupField: stage
          group: Proposal
          filter: "stage = 'Proposal'"
      - blockid: 7
        title: Negotiation
        kind: RecordOrganizer
        xywh: [24, 5, 8, 40]
        options:
          module: Deal
          labelField: name
          descriptionField: amount
          groupField: stage
          group: Negotiation
          filter: "stage = 'Negotiation'"
      - blockid: 8
        title: Won
        kind: RecordOrganizer
        xywh: [32, 5, 8, 40]
        options:
          module: Deal
          labelField: name
          descriptionField: amount
          groupField: stage
          group: Won
          filter: "stage = 'Won'"
      - blockid: 9
        title: Lost
        kind: RecordOrganizer
        xywh: [40, 5, 8, 40]
        options:
          module: Deal
          labelField: name
          descriptionField: amount
          groupField: stage
          group: Lost
          filter: "stage = 'Lost'"
    page_layouts:
      CrmPipelineDefault:
        primary: true
        meta: { title: Pipeline }
        config:
          visibility: { expression: "" }
        blocks:
          - { blockID: 1, xywh: [0, 0, 16, 5] }
          - { blockID: 2, xywh: [16, 0, 16, 5] }
          - { blockID: 3, xywh: [32, 0, 16, 5] }
          - { blockID: 4, xywh: [0, 5, 8, 40] }
          - { blockID: 5, xywh: [8, 5, 8, 40] }
          - { blockID: 6, xywh: [16, 5, 8, 40] }
          - { blockID: 7, xywh: [24, 5, 8, 40] }
          - { blockID: 8, xywh: [32, 5, 8, 40] }
          - { blockID: 9, xywh: [40, 5, 8, 40] }

  # ===========================================================================
  CrmDeals:
    title: Deals
    visible: true
    weight: 5
    blocks:
      - blockid: 1
        title: Deals
        kind: RecordList
        xywh: [0, 0, 48, 30]
        options:
          module: Deal
          presort: close_date ASC
          perPage: 25
          allowExport: true
          fields:
            - name: name
            - name: stage
            - name: amount
            - name: probability
            - name: forecast_amount
            - name: close_date
            - name: company
            - name: contact
            - name: owner
    page_layouts:
      CrmDealsDefault:
        primary: true
        meta: { title: Deals }
        config:
          visibility: { expression: "" }
        blocks:
          - { blockID: 1, xywh: [0, 0, 48, 30] }
    pages:

      RecordDeal:
        title: Deal
        module: Deal
        visible: false
        blocks:
          - blockid: 1
            title: About this deal
            kind: Record
            xywh: [0, 0, 16, 40]
            options:
              fields:
                - name: name
                - name: stage
                - name: amount
                - name: currency
                - name: probability
                - name: forecast_amount
                - name: close_date
                - name: closed_at
                - name: deal_type
                - name: priority
                - name: lead_source
                - name: contact
                - name: company
                - name: owner
                - name: lost_reason
                - name: description
                - name: properties
          - blockid: 2
            title: Activity timeline
            kind: RecordList
            xywh: [16, 0, 32, 20]
            options:
              module: Activity
              prefilter: "deal = ${recordID}"
              presort: createdAt DESC
              fields:
                - name: activity_type
                - name: subject
                - name: status
                - name: due_at
                - name: owner
          - blockid: 3
            title: Notes
            kind: RecordList
            xywh: [16, 20, 32, 20]
            options:
              module: Note
              prefilter: "deal = ${recordID}"
              presort: createdAt DESC
              fields:
                - name: title
                - name: body
                - name: pinned
        page_layouts:
          RecordDealDefault:
            primary: true
            meta: { title: Deal }
            config:
              visibility: { expression: "" }
              buttons:
                new: { enabled: true }
                edit: { enabled: true }
                submit: { enabled: true }
                delete: { enabled: true }
                clone: { enabled: true }
                back: { enabled: true }
            blocks:
              - { blockID: 1, xywh: [0, 0, 16, 40] }
              - { blockID: 2, xywh: [16, 0, 32, 20] }
              - { blockID: 3, xywh: [16, 20, 32, 20] }

  # ===========================================================================
  CrmActivities:
    title: Activities
    visible: true
    weight: 6
    blocks:
      - blockid: 1
        title: Open tasks and meetings
        kind: RecordList
        xywh: [0, 0, 48, 18]
        options:
          module: Activity
          prefilter: "status = 'Planned'"
          presort: due_at ASC
          fields:
            - name: activity_type
            - name: subject
            - name: due_at
